    {contract}

    V2 SPEC (v2.py, rule-based, no network, standard library only: json, re, uuid, hashlib, datetime; plus `import v3`, the V3 INTERFACE module written by someone else). Build datetimes
    only with datetime.combine(day_d, dtime(h, m)) or strptime; never datetime(...) with a date object as argument.
    Every list returned is a copy in insertion order. ids: prefix + uuid4().hex[:10] ("log_", "plan_", "prop_", "itm_").

    init_v2(S): S["log"] = [], S["beliefs"] = {} (key -> Belief), S["deleted_beliefs"] = [], S["penalty"] = {},
    S["blocked"] = {} (belief key -> confidence when its proposal was dismissed/reverted), S["proposals"] = [],
    S["plans"] = {}, S["view"] = {"type": "week", "params": {}}, S["meta"] = {"novelty": 0.6, "cadence_hours": 24,
    "breakdown_appetite": 0.5, "tone": "gentle"}, S["invented_reverts"] = [], S["last_proposal_at"] = None,
    S["learn_mark"] = 0, S["activity"] = [], S["prompts"] = version 1 of agents designer, followthrough, learner:
    {"agent", "version": 1, "core_hash": sha256 of that agent's fixed core text (one sentence per agent) hexdigest()[:12],
    "learned": "", "diff": "", "reason": "initial version", "evidence": [], "replay": {"passed": True, "detail":
    "initial"}, "active": True}. Seed item ids count as valid evidence.

    ITEM MATCHING: words of the text, lowercased, minus stop words (move, reschedule, push, shift, postpone, bump, delay,
    put, off, back, by, later, earlier, cancel, delete, remove, drop, scrap, skip, my, the, a, an, to, on, at, for, next,
    week, weeks, day, days, one, please, it). An open item matches when one of its title words (3+ letters) is in that set;
    best = most matching words, then earliest start. No match -> an info message "I couldn't find that one. Which item
    do you mean?" and no change.

    DAY WORDS (shared by QUERY, BULK, MOVE, TEXT import): today, tomorrow, weekday names and mon..sun (the soonest such
    date after today; "this saturday" the same), "October 23" / "Oct 23" / "2026-10-23", and a bare day of month
    "the 23rd" / "23rd" / "the 5th" / "on the 2nd" (this month; if that day is before today, next month). PART OF DAY
    narrows a day: morning 00:00-12:00, afternoon 12:00-17:00, evening / tonight 17:00-24:00.
    Hidden scenarios phrase these commands in OTHER words than the examples (other personas), so match the meaning
    with these broad trigger lists, never only the example sentences.

    handle_command(S, text) (lowercase, strip; try the rules IN THIS ORDER, return None unless one fires):
    - BULK (first): text has a clearing phrase (empty, clear, clear out, free up, wipe, nothing on, no plans,
      keep ... free, block out, cancel everything, cancel all, make room) AND a range (weekend, or a day word,
      optionally with a part of day). Range = the weekend = coming Saturday 00:00 to Monday 00:00 (if today is Saturday
      or Sunday, this weekend), or that one day 00:00-24:00, or only that part of that day ("friday evening" = Friday
      17:00-24:00, so a Friday 09:00 standup is NOT affected). affected = ids of open items whose [start, end) overlaps
      the range (no end -> start + 60 min; no start -> skip); items on other days are never affected.
      Plan ops: one delete op per affected item (before = copy of the item, after None) plus ALWAYS exactly ONE create
      op for the reason: purpose = the words after "for" if present, else the clause after the first comma (or after
      because / since / as); drop leading i have / i've got / i got / i'm / i am / we have / we're / there's / a / an /
      my / some / please; capitalise. "for a business trip" -> "Business trip", "I have a family reunion" -> "Family
      reunion", "I'm travelling to Lisbon" -> "Travelling to Lisbon", "I got concert tickets" -> "Concert tickets";
      no purpose -> "Time off". after = a full new Item, kind "event", that title, start/end: weekend Saturday 09:00 to
      Sunday 18:00, one day 09:00-18:00, part of day its range clipped to 23:59 (evening 18:00-23:00), window the range
      words ("weekend", "saturday", "friday evening"), source "typed". Plan {"id", "origin": "command", "status":
      "preview", "ops", "affected"} stored in S["plans"]. Nothing changes until apply. Response {"messages": [one info
      message naming how many items it would clear and the new one, ending "Shall I apply it?"], "created": [], "plan": plan}.
    - QUERY: text ends with "?" or starts with what / what's / whats / anything / any / show / when / do i have / is
      there / am i: find the day with DAY WORDS ("anything on the 23rd?" -> the 23rd of this month; none = today). Reply
      message kind "reply" naming EVERY item (any status) whose start date is that day, with its HH:MM or window,
      e.g. "On Thursday: Dentist at 15:00, Lunch with Ana around noon." (nothing there -> "Thursday looks free.").
      Changes nothing, creates nothing; add_log "query" (item_ids = those items, source "typed"). created [].
    - CANCEL: text starts with cancel / delete / remove / drop / scrap / skip / get rid of / forget / i don't need:
      best matching item -> a preview plan with one delete op (affected [id]) and an info message "I can remove 'Yoga'
      for you. Apply the change?"; response includes "plan"; the item stays until apply_plan.
    - MOVE: text starts with move / reschedule / push / shift / postpone / bump / delay / put off / pull: best matching
      item; the shift: "next week", "a week", "back a week", "by a week", "a week later", "one week" -> start and end
      +7 days; "N weeks" -> +7N days; "tomorrow", "a day", "back a day" -> +1 day; "N days" -> +N days; a weekday name ->
      that weekday, same time; a clock time -> same day at that time, same length. "push the eye exam back a week" moves
      Eye exam from 2026-10-23T14:00 to 2026-10-30T14:00. ONE item moved is applied at once (no plan): store
      S["undo"][undo_id] = its old start/end/window/postpone_count, update it, add_log "update" (item_ids [id], payload
      old and new start), info message "Moved 'Dentist' to Thu Oct 29 at 15:00." with that undo_id. Response
      {"messages", "created": []}.

    PLANS: apply_plan: only from status "preview" (else return it unchanged): delete op -> remove the item; create op
    -> append a copy of after; update op -> replace the item with after. status "applied"; add_log "plan_applied"
    (item_ids = affected + created ids, payload plan id), plus one add_log "delete" / "create" / "update" per op with its
    item id. undo_plan: only from "applied": put every before item back with all its original fields (deleted ones
    re-inserted), remove created ones; status "undone"; add_log "plan_undone".

    import_file(S, filename, content): ICS when content contains BEGIN:VCALENDAR or filename ends .ics, else TEXT.
    - ICS: normalise \r\n, unfold lines starting with a space, read each BEGIN:VEVENT..END:VEVENT. Property name =
      text before the first ";" or ":", value = text after the first ":". DTSTART/DTEND value "YYYYMMDD" (VALUE=DATE)
      -> all-day: start "YYYY-MM-DDT00:00", end = DTEND date at 00:00 (or next day), window "all day"; value
      "YYYYMMDDTHHMMSS" with or without TZID or a trailing Z -> keep the wall-clock digits exactly (20261022T091500 ->
      "2026-10-22T09:15"; never convert zones, never round). Item kind "event", title SUMMARY, source "ics", "uid" = UID,
      "recurrence" = the RRULE value or None, every other Item key default. One create op per VEVENT, EXCEPT skip a
      VEVENT whose UID equals the uid of an existing item or whose title (case-insensitive) and start equal an
      existing item's: re-importing the same file gives a plan with 0 creates.
    - TEXT: split into sentences on . ! ? and newlines. A sentence with away / clear / free / cancel / off plus weekend
      or a day word -> delete ops for open items overlapping that range (same range rule as BULK). Any other sentence
      with a day word, clock time or soft window ("around noon" 12:00-13:00, morning 09:00-12:00, afternoon 14:00-17:00,
      evening 18:00-21:00) -> one create op: title = the sentence minus also/on/at, day and time words, capitalised
      ("Lunch with Ana"), start on that day, window kept, kind "event" if it has with/lunch/dinner/meet/call else
      "task", source "text". So "I'll be away this weekend, please clear it. Also lunch with Ana on Wednesday around
      noon." gives deletes for the weekend items plus a create "Lunch with Ana" on Wednesday 12:00, window "around noon".
    - Both: plan origin "import", status "preview", stored; add_log "import" (item_ids = affected ids, payload
      filename and op count, source "ics" or "text"). Return {"plan"}.

    VIEWS: view_state(S) returns {"type", "params", "hidden_counts"} with hidden_counts computed fresh from S["items"]
    (items with a start): workweek hides Saturday and Sunday dates; day hides every date but today; week hides dates
    outside today's Monday-Sunday; month hides dates outside this month; custom hides weekend dates only when
    params "hide_weekends" is true. hidden_counts = {date: number of hidden items on it}. set_view(S, t): t must be
    month/week/workweek/day, sets S["view"], add_log "view_switch" (payload type, source "person"), returns {"view"}.

    HABIT LEARNER (learn_beliefs(S), inside learn and tick): build history = seed items with status "done" (time = their
    end, else start; evidence = item id) plus log entries of kind "done" (time = entry at; evidence = entry id). Each
    belief: {"key", "level": "habit", "statement", "value", "confidence" (0..1, 2 decimals), "evidence" (ids, at most
    20), "updated_at": now}. Skip every key in S["deleted_beliefs"]. confidence = max(0, share * min(1, n / 6) -
    S["penalty"].get(key, 0)).
    - evening_work: n = history size >= 5, k = how many have hour >= 20; if k/n >= 0.5: statement "Finishes tasks after
      8 PM (k of n)" (e.g. "(8 of 9)"), value 20, share k/n. With 3 more morning dones the share falls to 8/12, so the
      confidence drops. Else morning_work when hour < 12 for >= half: "Gets things done in the morning (k of n)".
    - no_weekend: all items with a start (any status) spanning w distinct ISO weeks, w >= 4, none of them on a Saturday
      or Sunday: statement "No weekend plans in w weeks (0 of N items)", value true, share = 1, confidence min(1, w/8)
      minus penalty; evidence = their ids.
    - block_length: n >= 6 done history items with start and end; m = median length in minutes; k = within 15 min of m:
      statement "Tasks usually take about m minutes (k of n)", share k/n.
    - EVERY stored belief has a non-empty "evidence" list of existing log ids / seed item ids and a number 0..1 as
      "confidence"; no belief is stored without evidence. Never make beliefs out of S["meta"] values (no
      "meta.novelty" belief): the only meta-level belief is prefers_classic from the META-LEARNER.
    - A belief whose confidence changed by >= 0.05 or that is new -> activity "belief_update" (text = statement and
      confidence); crossing 0.7 upward -> activity "threshold_crossed". delete_belief(S, key): remove it, append key to
      S["deleted_beliefs"] (never re-learned until reset), add_log "belief_deleted", activity "belief_deleted".

    PROPOSAL GATE (run_gate(S), after learning in learn and tick): open = a proposal with status "shown". If none is
    open and (last_proposal_at is None or now - last_proposal_at > cadence_hours hours): candidates = habit beliefs
    with confidence >= 0.7, not in S["blocked"] unless confidence > blocked value + 0.15; order no_weekend,
    evening_work, morning_work, block_length, then higher confidence first. Take the first. novelty = "invented" while
    len(S["invented_reverts"]) < 2, else "classic" (do NOT derive it from the meta novelty number). View: classic no_weekend {"type": "workweek"}; classic evening/morning {"type":
    "day", "params": {"focus": "evening" or "morning"}}; classic block_length {"type": "week", "params": {"block_min": m}};
    invented (any belief) the custom view of V3 ADDITIONS below. Proposal {"id",
    "title" (e.g. "Hide weekends", "Evening lane"), "reason" = the belief statement + a gentle question ("No weekend
    plans in 10 weeks (0 of 50 items). Hide weekends?"), "view": the spec with hidden_counts, "belief_keys": [key],
    "novelty", "prompt_versions": {agent: active version number}, "status": "shown"}. Append, set last_proposal_at =
    now, add_log "proposal_shown", activity "proposal_shown". No candidate -> no proposal. learn(S) returns
    {"beliefs": all beliefs incl. meta, "proposal": the open proposal or None}. tick(S, on_clock): when on_clock or
    len(S["log"]) - S["learn_mark"] >= 5: set learn_mark, learn beliefs, run the gate.

    PROPOSAL ACTIONS: accept (status shown): proposal["prev_view"] = copy of S["view"], S["view"] = the proposal view,
    status "accepted", add_log "proposal_accepted". undo (status accepted): S["view"] = prev_view, status "reverted",
    S["penalty"][key] += 0.2 and recompute so the belief's confidence drops at once, S["blocked"][key] = new
    confidence, add_log "proposal_reverted"; if novelty was invented: append that log id to S["invented_reverts"],
    meta novelty = round(max(0, novelty - 0.1), 2) (exactly once per invented revert, nowhere else), and when len(S["invented_reverts"]) reaches 2 (then 4, 6 ...) run
    the META-LEARNER. dismiss (status shown): status "dismissed", S["blocked"][key] = confidence, add_log
    "proposal_dismissed". Each action adds activity "proposal_<action>". Returns {"proposal", "view": view_state(S)}.

    META-LEARNER: new designer version = previous active version + 1, same core_hash, learned = previous learned plus
    the line "- Prefer classic views (workweek, week, day): 2 invented views were reverted." (keep at most 12 lines;
    never the words ignore, override or core rules), diff = "+ " + that line, reason "2 invented proposals were
    reverted", evidence = the reverted log ids, replay = {"passed": True, "detail": "learned text checked: <= 12 lines,
    no rule override"} (actually check it), active True; the old version active False. Add a meta belief {"key":
    "prefers_classic", "level": "meta", "statement": "Prefers classic views (2 of 2 invented views reverted)",
    "value": "classic", "confidence": 0.8, "evidence": those log ids}. Activity "prompt_rewrite" with agent
    "designer", text "designer v2: " + diff, and an extra key "diff". rollback(S, agent): the active version goes
    inactive and the version before it becomes active (none before -> keep v1 active); activity "prompt_rollback";
    return {"active": that version}. get_prompts returns every version of every agent.

    ACTIVITY: S["activity"] entries {"at": now, "agent": "learner" | "designer" | "followthrough", "kind", "text"},
    appended in time order; get_activity returns {"events": them}.

    V3 ADDITIONS to v2.py (behaviours 23, 25; the previous builds lost these points):
    - init_v2: S["meta"] also has "threshold": 0.7; S["dismiss_streak"] = 0. meta_state(S) returns a copy of all six meta
      keys (novelty, cadence_hours, breakdown_appetite, tone, threshold).
    - run_gate uses threshold = S["meta"]["threshold"] (never a literal 0.7) for candidates. The INVENTED view is
      spec = v3.best_spec(S, key); view = {"type": "custom", "params": {"belief": key}, "spec": spec, "hidden_counts":
      v3.hidden_counts(S, spec)} (an invented view without "spec" fails the harness).
    - view_state(S): for type "custom" with a "spec": return type, params, spec and hidden_counts = v3.hidden_counts(S, spec).
    - accept: also proposal["accepted_at"] = now, proposal["kept_credit"] = False, S["dismiss_streak"] = 0.
    - dismiss: S["dismiss_streak"] += 1; when it reaches 3: old values kept for the text, threshold = round(min(0.95,
      threshold + 0.1), 2), cadence_hours = cadence_hours * 2, S["dismiss_streak"] = 0, activity agent "designer" kind
      "knob_change" text like "Raised the proposal threshold from 0.70 to 0.80 and cadence from 24 to 48 hours: 3
      proposals in a row were turned down." (real numbers; activity texts never contain "dismiss" or "miss").
    - tick(S, True) FIRST checks every proposal with status "accepted", kept_credit False and now - accepted_at >= 72
      hours: kept_credit = True, threshold = round(max(0.5, threshold - 0.05), 2), activity kind "knob_change" text
      "Lowered the proposal threshold from 0.70 to 0.65: you kept the view '<title>' for 3 days.". Then learn + gate.
    - A deleted belief stays deleted: learn_beliefs skips every key in S["deleted_beliefs"] BEFORE computing or storing
      it (a previous build re-learned a deleted evening_work belief).

    Define every V2 INTERFACE function at module level, plus your own helpers. Check silently that every called name is defined and that every function returns the documented JSON-ready dict.
    Output exactly one artifact: <artifact name="v2_py">...whole file...</artifact> and nothing else.
  expects:
  - v2_py
- name: v3
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  reads:
  - contract
  max_tokens: 16000
  prompt: |-
    You write v3.py: the view catalog, mechanical critic and designer of this contract (behaviours 22-23), behind the V3 INTERFACE of your system message. app.py and v2.py are written by others at the same time and call your functions with exactly those names and arguments. Contract:
    {contract}

    V3 SPEC (v3.py; rule-based, deterministic, no network; datetimes only via strptime or datetime.combine).

    CATALOG, exactly this list in this order (get_catalog returns {"primitives": a copy}):
      {"type": "MonthGrid", "props": {"month": "date"}, "children": false}
      {"type": "WeekColumns", "props": {"start": "date", "days": "int"}, "children": false}
      {"type": "DayTimeline", "props": {"date": "date", "from_hour": "int", "to_hour": "int"}, "children": false}
      {"type": "AgendaList", "props": {"from": "date", "to": "date"}, "children": false}
      {"type": "Lane", "props": {"label": "str", "filter": "filter"}, "children": true}
      {"type": "Bucket", "props": {"label": "str", "filter": "filter"}, "children": false}
    A spec is {"root": id, "elements": {id: {"type", "props": {}, "children": [ids]}}}. Dates are "YYYY-MM-DD"
    (MonthGrid month is the 1st of the month, "2026-10-01"; "2026-10" is also accepted).

    SHOWN ITEMS shown_ids(S, spec): walk from root (visited set against cycles). For an item with start s: d = s[:10],
    h = int(s[11:13]). MonthGrid: d[:7] == month[:7]. WeekColumns: start <= d < start + days days. DayTimeline: d == date
    and from_hour <= h < to_hour. AgendaList: from <= d <= to. Items without start are shown only by Bucket / Lane.
    matches(filter, item): every key must hold: kind == item kind; window == item window; category == item.get("category");
    hour_from <= h (and h < hour_to) using the item's start hour (no start fails an hour key). {} matches every item.
    Bucket: items matching its filter. Lane with children: the union of its children's shown items that match the lane
    filter; Lane without children: items matching its filter. hidden_counts(S, spec) = {d or "unscheduled": count} of
    items in S["items"] not shown (empty dict when all are shown).

    critic(S, spec) collects problem strings, each naming its cause (the harness greps for the cause):
      1. spec not an object, "elements" not an object, root not in elements -> "root 'x' missing from elements".
      2. type not in the catalog -> "element 'a' has unknown type 'SpiralClock' (not in the catalog)".
      3. each child id not in elements -> "element 'a' child 'ghost' missing from elements"; children on a type whose
         catalog children is false -> "element 'b' (Bucket) cannot have children".
      4. props: unknown prop name -> problem; date kind: must be a str that strptime parses as %Y-%m-%d (month also
         %Y-%m) -> "element 'a' prop 'from' is not a valid date: 'someday'"; int kind: int and not bool (hours 0..24, days
         1..31) -> "... prop 'days' must be an int"; str kind: str; filter kind: dict whose keys are among kind, category,
         window, hour_from, hour_to.
      5. only when 1-3 found nothing: every item of S["items"] (any status) not in shown_ids and whose date is not in
         spec.get("hidden_counts", {}) with a count >= 1 -> "item 'Yoga' (2026-10-24) is hidden: neither shown nor counted".
      ok = no problems. When not ok: repaired = repair(S, spec) if critic of it is ok, else None; when ok: repaired None.
    repair(S, spec) on a deep copy: drop elements of unknown type and remove their ids from every children list; drop
    missing child ids and children of childless types; bad date -> today (S["now"][:10]; month -> its 1st); bad int ->
    default (from_hour 0, to_hour 24, days 7); bad filter -> {}; drop unknown props; missing root -> a new Lane "All"
    with the elements nobody lists as a child. If any item is still not shown: new root "repair_root" Lane label "All"
    filter {} with children [old root, "repair_rest"], and "repair_rest" = Bucket label "Everything else" filter {}.

    design(S, belief_key): key = belief_key or the key of the habit belief with the highest confidence in
    S.get("beliefs", {}) or "none". today_d = S["now"] date, monday_d = today_d - weekday days, saturday_d = monday_d + 5.
    Exactly 3 drafts; D0 and D1 end with the catch-all child "rest" = Bucket label "Everything else" filter {} as the
    LAST child of a root Lane (label as given, filter {}), so they never hide an item; D2 = D0 without "rest".
      - evening_work: D0 Lane "Your evenings" [DayTimeline date today from_hour 18 to_hour 24, Bucket "Evening tasks"
        filter {"hour_from": 18, "hour_to": 24}, rest]; D1 Lane "This week" [Lane "Evening lane" filter {"hour_from": 18,
        "hour_to": 24} children [WeekColumns start monday days 7], rest].
      - morning_work: the same with hours 6 to 12 and labels "Your mornings" / "Morning lane".
      - no_weekend: D0 Lane "Workweek" [WeekColumns start monday days 5, AgendaList from saturday to sunday, rest];
        D1 Lane "Weekdays first" [AgendaList monday..friday, AgendaList saturday..sunday, rest].
      - anything else: D0 Lane "Agenda" [AgendaList today..today+6, rest]; D1 Lane "Month" [MonthGrid month (1st of this
        month), rest].
    critique[i] = {"ok", "problems"} of critic(S, draft i); repairs = how many drafts failed and got a non-null
    repaired; chosen = index of the first ok draft (D0). Return {"drafts", "critique", "repairs", "chosen",
    "proposal": None}. best_spec(S, key) = design(S, key)["drafts"][chosen]. Different beliefs give different specs.

    Define get_catalog, critic, design, best_spec, hidden_counts at module level plus your helpers; never raise on a malformed spec (return ok false with a problem instead). Check silently that every called name is defined.
    Output exactly one artifact: <artifact name="v3_py">...whole file...</artifact> and nothing else.
  expects:
  - v3_py
- name: ui
  kind: llm
  model: claude:haiku
  reads:
  - contract
  max_tokens: 24000
  prompt: |-
    You write index.html for this contract (the endpoints, JSON shapes, element ids and the v3.2 look and feel matter to you):
    {contract}

    One page, inline CSS and JS, no CDN, 500-700 lines. Two judges read it: a harness checks the STATIC file text, and a
    screenshot judge (vision, design-doc rubric) scores the rendered page after a seeded session. The parent page scored
    0.46 with the judge for: a plain-list timeline with no soft blocks, tiny default-styled proposal buttons, panels that
    rendered EMPTY (its refresh() called endpoints that do not exist, /api/view GET and /api/timeline, threw, and blanked
    every panel), a duplicated id chat-input, raw ISO timestamps, a cut-off chat. Obey each rule literally.

    ROBUST SCRIPT
    - Exactly ONE element per id. #chat-input is the <textarea> itself.
    - api(method, path, body) helper with fetch + JSON; it returns null on an HTTP error instead of throwing.
    - refresh() GETs ONLY /api/state, /api/focus, /api/beliefs, /api/proposal and /api/activity (no other GET path exists),
      each in its own try/catch, and renders each panel in its own try/catch so one failure never blanks another panel.
      Call refresh() after every action and setInterval(refresh, 5000).
    - These literal strings appear in the script: '/api/command', '/api/chat', '/api/clock', '/api/undo', '/api/reset',
      '/api/view', '/api/import', '/api/focus', '/api/items/', '/api/proposals/', '/api/plan/', '/api/beliefs/'.

    LAYOUT (desktop ~1400 px, use the width; CSS grid, never one long column)
    - <header>: "Evolving Calendar" on the left; on the right the simulated clock from state.now formatted like
      "Mon, Oct 19, 7:50 PM", small buttons "+30 min", "+1 h", "Next morning" (next day 08:00) that POST /api/clock
      {"now": "YYYY-MM-DDTHH:MM"} (compute in JS from state.now), and "Start as Iris" which POSTs /api/reset with a const
      IRIS seed written in the script: now "2026-10-19T19:50"; 8 done tasks on 2026-10-11..18 each 20:15-20:45 (titles like
      "Reply to emails", "Pay bills"); open event "Call with Priya" 2026-10-20T18:00-19:00; open task "Write cover letter"
      2026-10-19T21:00-21:45 window "this evening"; open task "Get my portfolio together" (id "goal1", why "I want to feel
      proud of my work") with child task "List the projects you are proudest of" (parent_id "goal1", estimate_min 10,
      2026-10-19T20:15-20:25); event "Lunch with Ana" 2026-10-20T12:00-13:00 window "around noon"; event "Dentist"
      2026-10-22T15:00-16:00.
    - <main> grid: left column 45% "Talk to me", right column the rest; gap 24px; max-width 1400px; centered.
    - LEFT card "Talk to me": #chat-log as chat bubbles (agent left, light sage; person right, soft blue; 12px radius, max
      width 80%), its own scroll area (height about calc(100vh - 260px), overflow auto) scrolled to the bottom after each
      render so the newest message is fully visible. Under the newest agent message of kind question / breakdown / checkin
      with an item_id: quick-reply chips that POST /api/chat {"item_id", "text"}: question -> "Yes please" / "Not now";
      breakdown -> "Looks good" / "Smaller steps"; checkin -> "Too big" / "Wrong time" / "Not needed". Breakdown bubbles list
      their steps with "about N min". EVERY message with an undo_id gets an "Undo" chip -> POST /api/undo {"undo_id": m.undo_id}.
      Postponed and reminder bubbles look gentle (same calm style, a small clock glyph at most, never red). At the bottom:
      textarea#chat-input (placeholder "Tell me what's on your mind..."), a two-option toggle "Brain dump" / "One thing"
      (mode "dump" or "command"), and a Send button; Enter sends. When the newest agent message of kind question /
      breakdown / checkin has an item_id, typed text goes to POST /api/chat instead of /api/command. A response with "plan"
      shows its summary with "Apply" / "Undo" chips (POST /api/plan/<id>/apply | undo). A small "Import" area (textarea +
      filename input + button -> POST /api/import, then shows the plan with Apply) sits under the input, visually quiet.
    - RIGHT column, in this order:
      1. #focus card titled "Right now, just this": the step title large (22px, weight 600), "For: <parent title>" and
         "because: <why>" on their own line, "about N min" from estimate_min, buttons "Start 5 minutes" (written literally
         inside #focus in the HTML source; runs a 5:00 countdown shown in the card) and "I did it" (POST
         /api/items/<id>/done). const f = await api('GET', '/api/focus'); show f.item.title whenever f.item is not null;
         "Nothing to do right now" only when f.item is null.
      2. #proposal card titled "An idea": proposal title, reason (it cites a number), buttons "Try it" / "Not now" / "Undo"
         (Undo shown after accepting) -> POST /api/proposals/<id>/accept | dismiss | undo; normal-size buttons (padding
         8px 16px, radius 10px, accent fill for Try it, outline for the others). A calm tinted card, not a modal; shown
         (style.display = "block") only when a proposal is open.
      3. Calendar card titled "Your calendar": #view-switcher with four buttons month / week / workweek / day (the active
         one = state.view.type highlighted) -> POST /api/view {"type"}; then <section id="view"> drawn by renderView(state.view);
         then "N hidden on <date>" notes from state.view.hidden_counts (class hidden-note); then #timeline "Today and
         tomorrow": items whose start is on state.now's date or the next, sorted, each "8:15 PM  Title" with a small Done
         button (POST /api/items/<id>/done).
         Item blocks everywhere: an item with a window = SOFT block (rounded 10px, light accent fill, 1px dashed border,
         window text shown); an exact event = SOLID block (accent fill, white text); done items faded. Times as "3:00 PM".
         Week / workweek draw one column per day (header "Mon 19"), month a 7-column grid, day an hour timeline.
      4. Bottom row of two smaller, muted cards side by side: #learned "What I've learned" (each belief statement with a
         small "Forget" button -> DELETE /api/beliefs/<key>, then state.meta in plain words: "New ideas: 60%, check-ins every
         24 h, tone gentle") and #activity "Activity" (the last 8 events, newest last, time shown as "7:50 PM", never raw ISO).
    - STYLE: background #f7f6f2, cards #ffffff, 1px solid #e6e3da border, radius 14px, padding 18px, soft shadow; one muted
      accent, sage #6f9a7a (hover a little darker); text #2f3a33, muted #7a807b; font system-ui, -apple-system, "Segoe UI",
      sans-serif at 15px, line-height 1.5. No red anywhere, no alarm icons, no counters, no "overdue" wording. No <details>,
      nothing collapsed.

    STATIC CHECKS (the harness greps the file text)
    - Ids written in the HTML itself: chat-input, chat-log, focus, timeline, learned, activity, proposal, view-switcher.
    - VISIBILITY: the ONLY element that may start hidden is #proposal. No display:none, visibility:hidden or hidden
      attribute anywhere else (to hide the Undo button of the proposal use opacity 0.4 and disabled, not display none).
    - One <style> block with at least 40 rules, one rule per line, including body, header, main, #chat-log, #chat-input,
      #focus, #focus button, #timeline, #timeline li, #learned, #learned li, #activity, #activity li, #proposal,
      #view-switcher, #view-switcher button, button, button:hover, textarea, .msg, .agent, .person, .question, .breakdown,
      .reminder, .postponed, .checkin, .undo, .plan, .hidden-note, .steps, .done, .chip, .soft, .solid.
    - V3 view rendering (behaviour 24): renderView(view) handles month / week / workweek / day and, for type "custom",
      reads view.spec.elements and view.spec.root and renders recursively with renderEl(id): a switch on el.type whose cases
      name every catalog type literally: 'MonthGrid', 'WeekColumns', 'DayTimeline', 'AgendaList', 'Lane', 'Bucket' (unknown
      type -> a small note). Day-based types draw one cell per date, Lane / Bucket a labelled box with the matching items.
    - Every day cell: el.setAttribute('data-day', 'YYYY-MM-DD'); every rendered item (in #view and #timeline):
      el.setAttribute('data-item', item.id).
    - Morph (FLIP): before redrawing store getBoundingClientRect() of every [data-day] and [data-item] element by its
      attribute; after redrawing, for each element whose key existed, el.animate([{transform: 'translate(dx px, dy px)'},
      {transform: 'none'}], {duration: 300, easing: 'ease-out'}); new elements fade in with opacity. CSS: [data-day],
      [data-item] { transition: opacity 300ms ease, transform 300ms ease; } Every duration in the file is 300ms or less.
    - Reduced motion: @media (prefers-reduced-motion: reduce) { *, [data-day], [data-item] { transition: none !important;
      animation: none !important; } } and in JS const reduceMotion = window.matchMedia('(prefers-reduced-motion:
      reduce)').matches; when true skip el.animate.
    Before answering, check silently: every template literal and bracket is closed, every function you call is defined.
    Output exactly one artifact: <artifact name="index_html">...whole file...</artifact> and nothing else.
  expects:
  - index_html
- name: smoke1
  kind: check
  check: app_smoke
  calls: basic
- name: behaviour
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  reads:
  - contract
  - blackboard.smoke1
  - artifact.app_py
  max_tokens: 32000
  prompt: |-
    You are stage 2 of the STAGED BUILD. Contract:
    {contract}

    Smoke report of stage 1 (app.py + v2.py run together; if it names a v2.py problem, leave it: a fixer handles v2.py):
    {blackboard.smoke1}

    Stage 1 app.py:
    {artifact.app_py}

    Re-emit the whole app.py: fix what the smoke report names in app.py, then add CHAT (with APPETITE and the complexity check reading it), the breakdown builder, CLOCK + SCHEDULER (with the LOGGING calls and v2.tick(S, True) at the end) and selftest() run by the --selftest flag, exactly as your system message says. Keep every V2 and V3 INTERFACE route and call. Follow DATETIME SAFETY in every new line.
    Output exactly one artifact: <artifact name="app_py">...whole file...</artifact> and nothing else.
  expects:
  - app_py
- name: smoke
  kind: check
  check: app_smoke
  calls: v2
  selftest: true
  selftest_secs: 20
- name: fixer
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  reads:
  - contract
  - blackboard.smoke
  - artifacts_named_by.smoke
  max_tokens: 32000
  prompt: |-
    The team's app (app.py + v2.py + v3.py + index.html) was just started by the smoke check, which also ran `python app.py --selftest`. Its report:
    {blackboard.smoke}

    If the report starts with "SMOKE: PASS", output only the word NO_CHANGE. Otherwise find the ROOT cause of every compile error, traceback, selftest failure, HTTP 500 or wrong JSON shape (read the last frames of the traceback and the named file and line), fix it in the source, and check the same mistake is not repeated elsewhere (every datetime(...) call, every v2.<name> / v3.<name> call against the V2 / V3 INTERFACE lists, every name used but never defined). A missing or empty file must be written in full from the spec in your system message and the contract. A traceback from selftest() means the bug is in the app code it called: fix that code, never delete or weaken selftest(). Keep all behaviour that already works; do not rename functions, endpoints or V2 INTERFACE names.
    Code map: bulk / query / move / cancel commands, plans, imports, beliefs, proposals, knobs and prompts live in v2.py; catalog, critic and design in v3.py; parsing, chat, clock, focus and selftest in app.py. Never re-emit a file unchanged.
        Re-emit ONLY the files that need a change (usually one), each whole, as <artifact name="...">...</artifact> with the existing names (app_py, v2_py, v3_py, index_html). Do not re-emit a file the report does not implicate.
- name: reviewer
  kind: llm
  model: crusoe:openai/gpt-oss-120b
  reads:
  - artifact.index_html
  max_tokens: 5000
  prompt: |-
    You review index.html against a checklist; you do not write code.

    {artifact.index_html}

    Check each item literally and report only real violations (what is wrong, what it must be):
    1. The script names all six catalog types ('MonthGrid', 'WeekColumns', 'DayTimeline', 'AgendaList', 'Lane', 'Bucket'), reads view.spec.elements, sets data-day and data-item, animates with a transition or el.animate of <= 600 ms, has @media (prefers-reduced-motion: reduce), and shows f.item.title in #focus.
    2. index.html: refresh() GETs only /api/state, /api/focus, /api/beliefs, /api/proposal, /api/activity, each in its
       own try/catch; no id appears twice; the script contains '/api/chat' and '/api/clock' literally; "Start as Iris" posts
       /api/reset with a non-empty items list; the grid has two columns; no unclosed template literal or bracket.
    3. Only #proposal may start hidden; ids chat-input, chat-log, focus, timeline, learned, activity, proposal, view-switcher each appear exactly once; 'Start 5 minutes' is literal inside #focus; every message with an undo_id gets an Undo button.
    If nothing is wrong, answer with the single line ALL_CLEAR. Otherwise list the violations, one per line.
- name: fixer2
  kind: llm
  model: claude:haiku
  reads:
  - blackboard.reviewer
  - artifact.index_html
  max_tokens: 24000
  prompt: |-
    The reviewer found these problems in index.html:
    {blackboard.reviewer}

    index.html:
    {artifact.index_html}

    If the reviewer's answer starts with ALL_CLEAR, output only NO_CHANGE. Otherwise fix exactly those problems, keep everything else (layout, style, ids) unchanged, and re-emit the whole file as <artifact name="index_html">...</artifact>.
workflow:
- parallel:
  - core
  - v2
  - v3
  - ui
- smoke1
- behaviour
- smoke
- loop:
    body:
    - fixer
    - smoke
    max_rounds: 2
    stop_when: 'SMOKE: PASS'
    check_first: true
- loop:
    body:
    - reviewer
    - fixer2
    - smoke
    max_rounds: 1
    stop_on: reviewer
    stop_when: ALL_CLEAR
- loop:
    body:
    - fixer
    - smoke
    max_rounds: 1
    stop_when: 'SMOKE: PASS'
    check_first: true
artifacts:
- name: app_py
  format: text
- name: v2_py
  format: text
- name: v3_py
  format: text
- name: index_html
  format: text
outputs:
  answer: artifact.app_py
