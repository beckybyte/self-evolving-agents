mechanism: deepseek writers
notes: 'Hypothesis: the expensive repair rounds come from first drafts that do not compile (smoke1 and smoke failed in 0.0 s in both parent runs; r1 v2 emitted 16 tokens). core, v2 and behaviour are written by DeepSeek-V4.1-Flash #nothink (listed as a reliable coder, x0.5 instead of x1) with expects, the fixer is DeepSeek too, haiku only as a one-round rescue; no reviewer. UI by gpt-oss against the exact failed static checks; V2 spec fixes for the r1 meta failures.'
soul: |
  You are part of a small team writing one Python 3.12 app (standard library only) against a frozen contract.
  Always emit complete files inside <artifact name=...> tags, never fragments or diffs. Simulated clock only.
  The app is rule-based: it must work with no language model at all. The spec below is binding.

  BUILD RULES (the previous team lost almost every point to crashes, not to logic: a missing method, a NameError at
  startup, a handler that dropped the connection. The parent build passed v1 (behaviours 1-9) almost fully and lost
  nearly all its remaining points on v2 (behaviours 10-21), which nobody had specified: the V2 sections below fix that).
  - TWO Python files: app.py holds the v1 server (store, parsing, conversations, scheduler, focus, HTTP) and v2.py
    holds the v2 learning loop (log, plans, imports, beliefs, proposals, views, prompts, activity), joined ONLY by the
    V2 INTERFACE below. No other files, no imports beyond the standard library (app.py also does `import v2`).
    Every function you call must be defined in the file that calls it (or be a V2 INTERFACE function called as
    v2.<name>); re-read every name before you finish. Start with `python app.py --port P --data D` via argparse; os.makedirs(D, exist_ok=True);
    ThreadingHTTPServer on 0.0.0.0; one global threading.Lock held during each request.
  - do_GET / do_POST wrap everything in try/except and ALWAYS answer JSON (status 200 for success, 400/404/500 with
    a JSON object with key "error" otherwise) with Content-Type and Content-Length. Never let an exception escape a handler.
  - GET / serves index.html from the app.py directory; if that file is missing, serve a small built-in page that still
    has the ids chat-input, chat-log, focus, timeline.
  - State is plain dicts/lists (items, messages, conversation state per item id, undo records, sent-reminder keys,
    now). Saving a JSON copy under --data is optional; if you save, never let it fail a request.
  - Times: parse and format with datetime.strptime/strftime "%Y-%m-%dT%H:%M". Never use the real clock.

  DATETIME SAFETY (the previous build crashed in BOTH runs on one line and lost every postpone, check-in and
  breakdown-accept check: HTTP 500 "'datetime.date' object cannot be interpreted as an integer", from
  datetime(day.year, day.month, day, hour, 0) in the free-slot finder, passing a date object as the day number).
    - Import "from datetime import datetime, date, time as dtime, timedelta". Build a datetime from a date d ONLY with
      datetime.combine(d, dtime(h, m)). Never call datetime(...) with a date or datetime object as an argument.
    - Name every date-only variable with a _d suffix (day_d, deadline_d) and every datetime with _dt; compare like
      with like (datetime with datetime, date with date); turn a datetime into its date with .date().
    - Items store times as ISO strings; parse with parse_iso only where you need arithmetic, store back with fmt_iso.

  STATE SHAPES
  - Item: every key of the contract Item always present (missing seed fields get defaults: window/why/parent_id/
    estimate_min/start/end None, status "open", postpone_count 0, source "seed"). Seed items keep their ids.
  - Message: always all keys id, role, kind, text, item_id, at (= simulated now), undo_id; key "steps" ONLY on kind
    "breakdown". One helper add_agent(kind, text, item_id=None, undo_id=None, steps=None) appends and returns it.
  - Every response's "messages" lists the new messages of that request (person messages may be included, agent
    messages must be). EVERY /api/reset, /api/command, /api/chat MUST produce at least one agent message:
    reset adds a warm agent "info" greeting ("Hi, I'm here whenever you want to plan a little."); command replies
    with an "info" confirmation naming what was added (plus the complexity question when relevant).

  NO-GUILT WORDING: no agent text may contain these substrings (case-insensitive): overdue, fail, miss, late,
  behind, should have, forgot, lazy, urgent, alert. Note "later", "dismiss", "relate" contain banned substrings:
  do not use them. Run every agent text through a check that replaces any banned phrase with a kind one.

  PARSING (rules only, no model needed)
  - Date words: today, tomorrow, weekday names (monday..sunday, also mon..sun) = the soonest such date after today
    (2026-10-19 is a Monday, so "thursday" -> 2026-10-22), "Friday, October 23" / "October 23" / "Oct 23" /
    "2026-10-23" -> that date. No date word -> today if the time is still ahead, else tomorrow.
  - Clock times: "3pm", "3 pm", "3:30pm", "15:00", "at 9" (1..7 without am/pm means pm). A clear clock time makes an
    "event": start = date+time, end = start + 60 min, window None.
  - Soft windows keep their words in `window` and get an approximate start/end on that date: "around noon"/"noon"/
    "lunch" 12:00-13:00, "morning" 09:00-12:00, "afternoon"/"this afternoon" 14:00-17:00, "evening" 18:00-21:00,
    "tonight" 20:00-22:00. Such an item is an event if it is an appointment with someone (with/meet/lunch/dinner/call
    with), else a task. "lunch with Ana around noon tomorrow" -> window "around noon", start 2026-10-20T12:00.
    - Date words may come before or after the time phrase ("lunch with Ana around noon tomorrow", "tomorrow lunch
      with Ana around noon"): find the date word anywhere in the text first, remove it, then the time/window; the date
      applies to windows too (that example -> start 2026-10-20T12:00, window "around noon", title "Lunch with Ana").
      The title never keeps date or time words (no "tomorrow", "thursday", "3pm", "around noon").
  - Title: the text with the date/time words removed, first letter capitalised ("Dentist", "Lunch with Ana").
  - No time at all -> kind "task" with start/end None ("maybe ..." or ending in "?" -> kind "note"). Source "typed".
  - Dump mode: split on commas, semicolons and newlines (not on "and"); every non-empty fragment becomes exactly one
    item, source "dump", title keeps the fragment's main words (strip "maybe", "?"). Reply with ONE info message listing
    the titles, plus AT MOST ONE question in the whole response (the complexity question of the first big fragment,
    if any; e.g. "portfolio" is big).

  COMPLEXITY CHECK (rule 3): a new task is big/vague when its text contains work on, figure out, deal with, sort out,
  get ... together, organize, plan, prepare, project, portfolio, pitch deck, thesis, website, garage, move, taxes, or
  estimate_min > 120 (match whole words: "plan" must not match "plants"). Then add exactly ONE agent message kind "question", item_id = the item, text like "This one
  sounds big. Want me to break 'Get my portfolio together' into small steps?" and set convo[item_id] = "ask_split".
  Nothing is broken down and no child is created without a yes.

  CHAT (/api/chat, convo state machine per item id; one question per message, each text holds exactly one "?")
  - yes words: yes, yeah, yep, sure, ok, okay, please, looks good, sounds good, great, perfect, do it, go ahead.
    no words: no, nope, not now, not right now, no thanks, later (checked BEFORE yes words; "no thanks, not right now" is a no).
  - ask_split: no -> info "Okay, I'll keep it as one task." state None. yes -> question "Why does this matter to you?"
    state ask_why. Anything else -> treat as yes.
  - ask_why: store the reply text as the item's why (exact text) -> question "What does done look like for you?"
    -> ask_done (store reply) -> question "Is there a deadline, a day you'd like it finished by?" -> ask_deadline: parse a
    date from the reply (rules above; none -> now + 7 days) -> breakdown message -> state propose.
  - Breakdown message: kind "breakdown", item_id = goal, text "Here's a gentle plan for '<title>'. Does this look ok?",
    steps = 3 or 4 dicts with keys "title" and "estimate_min". Each title starts with a concrete verb from: List, Pick, Write,
    Open, Collect, Choose, Draft, Email, Call, Book, Clear, Sort, Find, Gather, Send, Review, Update, Upload, Read.
    First step estimate 10 (<= 15), the others 30-60. Build them from the goal title (for a portfolio: "List the
    projects you are proudest of" 10, "Pick the five best projects" 30, "Write a short note for each project" 60,
    "Upload the projects to a simple website" 60); generic fallback: "Open a note and list what '<title>' needs" 10,
    "Pick the first piece to start" 20, "Draft the first piece" 45, "Review it and send or save it" 30.
  - propose: yes words -> create one task per step: parent_id goal id, source "agent", estimate_min, start/end
    scheduled one per day starting today (or tomorrow if today's slot has passed) at the person's usual hour
    (see SCHEDULER), end = start + estimate, all strictly before the deadline date (if the days run out, place the
    rest back to back on the last day before the deadline). Goal why stays set. Info message "Done, the first tiny step
    is '<step 1>'." state None. Other text -> a revised "breakdown" message (e.g. smaller steps, max 5) and stay.
  - checkin (state after a check-in): text with big/smaller/break/too much -> immediately send a "breakdown" message
    for that item (state propose); time/busy/wrong -> move it to the next day's free slot, info naming the new time;
    not needed/drop/remove/don't need -> question "Shall I remove '<title>' for you?" state confirm_drop; in
    confirm_drop yes -> delete the item, info; no -> keep it.

  DONE / UNDO: /api/items/<id>/done sets status "done", returns the JSON object with key "item". Undo records map undo_id -> the
  item's previous start, end, window, postpone_count; /api/undo restores them, returns ok true.

  CLOCK + SCHEDULER (/api/clock): if new <= now just return an empty "messages" list. Otherwise walk minute by minute from
  now+1 to new; at each minute t, for every open item (status "open") in a stable order:
  - Reminder at start: start is not None and start == t (crossed this minute), key (id,"start",start) not yet sent ->
    "reminder" message "It's time for '<title>' (20:00)." Reminder before end: end - 10 min == t and key (id,"end",end)
    not sent -> "reminder" "'<title>' wraps up in 10 minutes." Done items never get reminders. No duplicates ever.
  - Auto-postpone (kind "task" only, not goals with children): end is not None and t == end + 31 min. If
    postpone_count >= 2 -> do NOT move it; send ONE "checkin" message: "How did '<title>' feel? If it's too big, I can
    break it into smaller steps, or find a better time, or we can let it go. What would help?" set convo state
    "checkin", mark it so it is never repeated. Else move it: new day = end's date + 1, same length, the free slot (same day-scan the breakdown scheduler uses)
    that starts at or after the person's usual hour (try every 15 minutes up to 23:30; free = no open item with
    start/end overlaps it), else the first free slot from 08:00 that day. postpone_count += 1, store an undo record,
    send "postponed" message with undo_id: "No worries, I moved '<title>' to Tue Oct 20 at 21:30. Undo if you'd
    rather keep it." (always the task title and the HH:MM time).
  - Usual hour: from seed items with status "done" and a start, take the lower median start time and round down to the
    hour (Iris: 20:00). No history -> 19:00.
  - Set now = new at the end; return the new messages in order.

  FOCUS (/api/focus): goals = open items with a non-empty why; their open children (parent_id = goal id). If any:
  item = the open child with the earliest start (None last, then insertion order) across those goals, parent = its
  goal, why = goal why. Else item = the open task (no children of its own) with the earliest start, parent from its
  parent_id (or None), why = the parent's why, else the item's own why. "action" is always "Start 5 minutes".
  No open item -> item None, parent None, why None.

  V2 INTERFACE (app.py <-> v2.py). The two files are written by different writers at the same time and neither sees
  the other's code, so BOTH follow this list exactly (names, arguments, return shapes).
  - app.py keeps ONE global dict STATE. Keys app.py owns: "now" (ISO str), "items" (list of full Item dicts, every
    contract key present; v2 may add keys "uid" and "recurrence" to imported items), "messages" (list of full Message
    dicts), "convo", "undo", "sent". "undo" maps undo_id -> {"item_id", "start", "end", "window", "postpone_count"};
    /api/undo restores exactly those fields onto that item (v2 writes such records too for its moves).
  - v2.py NEVER imports app.py. Every v2 function takes that dict as first argument S, changes it in place and
    returns a JSON-ready dict. Unknown ids raise KeyError (app.py answers 404 JSON). v2 makes its own messages with
    the full Message shape, appends them to S["messages"] and returns them; v2 has its own wording check.
  - The functions (v2.py defines all of them, app.py calls them):
      init_v2(S)                        do_reset calls it right after loading the seed items (it sets the v2 keys)
      add_log(S, kind, item_ids, payload, source) -> LogEntry   app.py calls it for every v1 action (see LOGGING)
      handle_command(S, text) -> dict or None   /api/command in mode "command" calls it FIRST; a dict is the whole
                                        response ({"messages", "created", and "plan" for a preview}); None = not a
                                        query/move/cancel/bulk command, so app.py parses it as a new item as usual
      import_file(S, filename, content) -> {"plan"}
      apply_plan(S, plan_id) -> {"plan"};  undo_plan(S, plan_id) -> {"plan"}
      get_log(S) -> {"entries"};  get_beliefs(S) -> {"beliefs"};  delete_belief(S, key) -> {"ok": True}
      learn(S) -> {"beliefs", "proposal"};  get_proposal(S) -> {"proposal"}
      proposal_action(S, proposal_id, action) -> {"proposal", "view"}   action = accept | dismiss | undo
      set_view(S, view_type) -> {"view"};  get_prompts(S) -> {"prompts"};  rollback(S, agent) -> {"active"}
      get_activity(S) -> {"events"};  view_state(S) -> View spec;  meta_state(S) -> the meta dict
      tick(S, on_clock)                 app.py calls tick(S, True) at the end of /api/clock and tick(S, False) at the
                                        end of every other request that added log entries
  - app.py routes: GET /api/log, /api/beliefs, /api/proposal, /api/prompts, /api/activity; POST /api/import (body
    filename, content), /api/plan/<id>/apply, /api/plan/<id>/undo, /api/learn, /api/proposals/<id>/<action>,
    /api/view (body type), /api/prompts/<agent>/rollback; DELETE /api/beliefs/<key> (a do_DELETE method with the same
    try/except JSON wrapper). /api/state also returns "view": v2.view_state(S) and "meta": v2.meta_state(S).
  - LOGGING (app.py side, via v2.add_log, at = simulated now): "create" for each item created by /api/command
    (source "typed" or "dump", item_ids [id]); "done" (source "person"); "chat" for /api/chat, or "checkin_answer"
    when that item's convo state was "checkin" or "confirm_drop" (source "person"); "postponed" and "reminder" for
    every postponed/reminder message (source "clock", item_ids [id]); "update" for /api/undo and when a check-in
    moves an item; "delete" when a check-in drop removes an item.

  STAGED BUILD: app.py is grown in two stages, v2.py and index.html are written alongside, and the app is RUN after
  each stage.
    - Stage 1 (core, at the same time as v2.py and index.html): imports (incl. `import v2`), time helpers, store,
      add_agent, wording check, parsing, complexity check, reset/state/command/done/undo/focus endpoints, every V2
      INTERFACE route and LOGGING call, HTTP handler, main(). /api/chat and /api/clock exist but are minimal stubs that
      answer {"messages": [...]} with one info message (the stub chat still answers no to "no" words; the stub clock
      still sets now and calls v2.tick(S, True)). Each part is marked with a comment line "# === SECTION: <name> ===".
    - Stage 2 (behaviour): re-emits the WHOLE app.py, keeping stage 1 code unchanged unless the smoke report shows it
      is broken, and adds the CHAT state machine, the breakdown builder, the CLOCK + SCHEDULER section (with its
      LOGGING calls) and selftest() (SELFTEST), replacing the two stubs. It never edits v2.py.

  SELFTEST: app.py defines selftest(). main() runs it ONLY when started with --selftest (argparse flag
  store_true; --port/--data then optional, default data dir a temp dir): it runs selftest() and exits with code 0
  printing NOTHING; an exception prints its traceback and exits 1. The normal start never runs it. selftest() calls
  the endpoint functions directly (no HTTP) on a scripted day, under the lock, then wipes the state again:
    reset now 2026-10-19T09:00 with done history (h0 20:15-20:45 and h1 21:00-21:40 on 2026-10-13), open task
    t1 "Write cover letter" 2026-10-19T14:00-15:00, event yo "Yoga" 2026-10-24T10:00-11:00 and event den "Dentist"
    2026-10-22T15:00-16:00; command "dentist thursday 3pm"; command "lunch with Ana around noon tomorrow"; dump "call
    mom, portfolio, maybe yoga?"; command "get my portfolio together"; chat on that goal: "yes, please", "I want to
    feel proud", "Five projects online", "By Friday, October 23.", "looks good"; focus; mark the first child done;
    command "what's on thursday?"; command "move my dentist to next week"; command "cancel yoga" and apply its plan;
    command "empty out my weekend for a business trip", apply it, undo it; import a 2-event .ics text (one with
    TZID, one all-day) and apply; import the text "I'll be away this weekend, please clear it. Also lunch with Ana on
    Wednesday around noon."; learn; view "workweek"; if a proposal is open accept it, then undo it; prompts; rollback
    designer; activity; log; clock to 2026-10-19T16:00 (postpones t1); undo the postponed message's undo_id; clock
    to 2026-10-23T23:00 (reminders, postpones, check-in); chat on t1 "honestly it feels too big"; state; reset empty.
  selftest() has NO assertions: it only exercises every code path, and any exception propagates so the process exits
  with a traceback (the smoke check shows it and a fixer repairs the real cause). Keep it fast (well under 5 s).
roles:
- name: core
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  reads:
  - contract
  max_tokens: 24000
  prompt: |-
    You are stage 1 of the STAGED BUILD. Contract:
    {contract}

    Write app.py stage 1 exactly as the STAGED BUILD, BUILD RULES, STATE SHAPES, PARSING, COMPLEXITY CHECK, DONE / UNDO, FOCUS and V2 INTERFACE (routes, the v2.<name> calls and LOGGING) sections say. v2.py is written by someone else at the same time: call only the V2 INTERFACE functions, with exactly those arguments. Check silently that every called name is defined.
    Output exactly one artifact: <artifact name="app_py">...whole file...</artifact> and nothing else.
  expects:
  - app_py
- name: v2
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  reads:
  - contract
  max_tokens: 32000
  prompt: |-
    You write v2.py: the whole v2 learning loop of this contract (behaviours 10-21), behind the V2 INTERFACE of your system message. app.py (the v1 server) is written by someone else at the same time and calls your functions with exactly those names and arguments. Contract:
    {contract}

    V2 SPEC (v2.py, rule-based, no network, standard library only: json, re, uuid, hashlib, datetime). Build datetimes
    only with datetime.combine(day_d, dtime(h, m)) or strptime; never datetime(...) with a date object as argument.
    Every list returned is a copy in insertion order. ids: prefix + uuid4().hex[:10] ("log_", "plan_", "prop_", "itm_").

    init_v2(S): S["log"] = [], S["beliefs"] = {} (key -> Belief), S["deleted_beliefs"] = [], S["penalty"] = {},
    S["blocked"] = {} (belief key -> confidence when its proposal was dismissed/reverted), S["proposals"] = [],
    S["plans"] = {}, S["view"] = {"type": "week", "params": {}}, S["meta"] = {"novelty": 0.6, "cadence_hours": 24,
    "breakdown_appetite": 0.5, "tone": "gentle"}, S["invented_reverts"] = [], S["last_proposal_at"] = None,
    S["learn_mark"] = 0, S["activity"] = [], S["prompts"] = version 1 of agents designer, followthrough, learner:
    {"agent", "version": 1, "core_hash": sha256 of that agent's fixed core text (one sentence per agent) hexdigest()[:12],
    "learned": "", "diff": "", "reason": "initial version", "evidence": [], "replay": {"passed": True, "detail":
    "initial"}, "active": True}. Seed item ids count as valid evidence.

    ITEM MATCHING: words of the text, lowercased, minus stop words (move, reschedule, push, shift, cancel, delete, remove,
    drop, my, the, a, an, to, on, at, for, next, week, please, it). An open item matches when one of its title words
    (3+ letters) is in that set; best = most matching words, then earliest start. No match -> an info message
    "I couldn't find that one. Which item do you mean?" and no change.

    handle_command(S, text) (lowercase, strip; return None unless one rule fires):
    - QUERY: text ends with "?" or starts with what / what's / whats / anything / show / when: find the day (today,
      tomorrow, weekday name = the soonest such date after today, or "October 22" / "2026-10-22"; none = today). Reply
      message kind "reply" naming EVERY item (any status) whose start date is that day, with its HH:MM or window,
      e.g. "On Thursday: Dentist at 15:00, Lunch with Ana around noon." (nothing there -> "Thursday looks free.").
      Changes nothing, creates nothing; add_log "query" (item_ids = those items, source "typed"). created [].
    - BULK: text has empty / clear / free up / wipe AND weekend (or a weekday name, today, tomorrow): range = the
      weekend = coming Saturday 00:00 to Monday 00:00 (if today is Saturday or Sunday, this weekend), or that one day.
      affected = ids of open items whose [start, end) overlaps the range (no end -> start + 60 min; no start -> skip).
      Plan ops: one delete op per affected item (before = copy of the item, after None) plus, when the text names a
      purpose ("for a business trip"), ONE create op: after = a full new Item, kind "event", title from the purpose
      without a/an/my, capitalised ("Business trip"), start Saturday 09:00, end Sunday 18:00, window "weekend", source
      "typed". Plan {"id", "origin": "command", "status": "preview", "ops", "affected"} stored in S["plans"]. Nothing
      changes until apply. Response {"messages": [one info message naming how many items it would clear and the new
      one, ending "Shall I apply it?"], "created": [], "plan": plan}.
    - CANCEL: text starts with cancel / delete / remove / drop / get rid of: best matching item -> a preview plan with
      one delete op (affected [id]) and an info message "I can remove 'Yoga' for you. Apply the change?"; response
      includes "plan"; the item stays until apply_plan.
    - MOVE: text starts with move / reschedule / push / shift: best matching item; "next week" -> start and end +7 days;
      "tomorrow" -> +1 day; a weekday name -> that weekday, same time; a clock time -> same day at that time, same
      length. ONE item moved is applied at once (no plan): store S["undo"][undo_id] = its old start/end/window/
      postpone_count, update it, add_log "update" (item_ids [id], payload old and new start), info message "Moved
      'Dentist' to Thu Oct 29 at 15:00." with that undo_id. Response {"messages", "created": []}.

    PLANS: apply_plan: only from status "preview" (else return it unchanged): delete op -> remove the item; create op
    -> append a copy of after; update op -> replace the item with after. status "applied"; add_log "plan_applied"
    (item_ids = affected + created ids, payload plan id), plus one add_log "delete" / "create" / "update" per op with its
    item id. undo_plan: only from "applied": put every before item back with all its original fields (deleted ones
    re-inserted), remove created ones; status "undone"; add_log "plan_undone".

    import_file(S, filename, content): ICS when content contains BEGIN:VCALENDAR or filename ends .ics, else TEXT.
    - ICS: normalise \r\n, unfold lines starting with a space, read each BEGIN:VEVENT..END:VEVENT. Property name =
      text before the first ";" or ":", value = text after the first ":". DTSTART/DTEND value "YYYYMMDD" (VALUE=DATE)
      -> all-day: start "YYYY-MM-DDT00:00", end = DTEND date at 00:00 (or next day), window "all day"; value
      "YYYYMMDDTHHMMSS" with or without TZID or a trailing Z -> keep the wall-clock digits exactly (20261022T091500 ->
      "2026-10-22T09:15"; never convert zones, never round). Item kind "event", title SUMMARY, source "ics", "uid" = UID,
      "recurrence" = the RRULE value or None, every other Item key default. One create op per VEVENT, EXCEPT skip a
      VEVENT whose UID equals the uid of an existing item or whose title (case-insensitive) and start equal an
      existing item's: re-importing the same file gives a plan with 0 creates.
    - TEXT: split into sentences on . ! ? and newlines. A sentence with away / clear / free / cancel / off plus weekend
      or a day word -> delete ops for open items overlapping that range (same range rule as BULK). Any other sentence
      with a day word, clock time or soft window ("around noon" 12:00-13:00, morning 09:00-12:00, afternoon 14:00-17:00,
      evening 18:00-21:00) -> one create op: title = the sentence minus also/on/at, day and time words, capitalised
      ("Lunch with Ana"), start on that day, window kept, kind "event" if it has with/lunch/dinner/meet/call else
      "task", source "text". So "I'll be away this weekend, please clear it. Also lunch with Ana on Wednesday around
      noon." gives deletes for the weekend items plus a create "Lunch with Ana" on Wednesday 12:00, window "around noon".
    - Both: plan origin "import", status "preview", stored; add_log "import" (item_ids = affected ids, payload
      filename and op count, source "ics" or "text"). Return {"plan"}.

    VIEWS: view_state(S) returns {"type", "params", "hidden_counts"} with hidden_counts computed fresh from S["items"]
    (items with a start): workweek hides Saturday and Sunday dates; day hides every date but today; week hides dates
    outside today's Monday-Sunday; month hides dates outside this month; custom hides weekend dates only when
    params "hide_weekends" is true. hidden_counts = {date: number of hidden items on it}. set_view(S, t): t must be
    month/week/workweek/day, sets S["view"], add_log "view_switch" (payload type, source "person"), returns {"view"}.

    HABIT LEARNER (learn_beliefs(S), inside learn and tick): build history = seed items with status "done" (time = their
    end, else start; evidence = item id) plus log entries of kind "done" (time = entry at; evidence = entry id). Each
    belief: {"key", "level": "habit", "statement", "value", "confidence" (0..1, 2 decimals), "evidence" (ids, at most
    20), "updated_at": now}. Skip every key in S["deleted_beliefs"]. confidence = max(0, share * min(1, n / 6) -
    S["penalty"].get(key, 0)).
    - evening_work: n = history size >= 5, k = how many have hour >= 20; if k/n >= 0.5: statement "Finishes tasks after
      8 PM (k of n)" (e.g. "(8 of 9)"), value 20, share k/n. With 3 more morning dones the share falls to 8/12, so the
      confidence drops. Else morning_work when hour < 12 for >= half: "Gets things done in the morning (k of n)".
    - no_weekend: all items with a start (any status) spanning w distinct ISO weeks, w >= 4, none of them on a Saturday
      or Sunday: statement "No weekend plans in w weeks (0 of N items)", value true, share = 1, confidence min(1, w/8)
      minus penalty; evidence = their ids.
    - block_length: n >= 6 done history items with start and end; m = median length in minutes; k = within 15 min of m:
      statement "Tasks usually take about m minutes (k of n)", share k/n.
    - EVERY stored belief has a non-empty "evidence" list of existing log ids / seed item ids and a number 0..1 as
      "confidence"; no belief is stored without evidence. Never make beliefs out of S["meta"] values (no
      "meta.novelty" belief): the only meta-level belief is prefers_classic from the META-LEARNER.
    - A belief whose confidence changed by >= 0.05 or that is new -> activity "belief_update" (text = statement and
      confidence); crossing 0.7 upward -> activity "threshold_crossed". delete_belief(S, key): remove it, append key to
      S["deleted_beliefs"] (never re-learned until reset), add_log "belief_deleted", activity "belief_deleted".

    PROPOSAL GATE (run_gate(S), after learning in learn and tick): open = a proposal with status "shown". If none is
    open and (last_proposal_at is None or now - last_proposal_at > cadence_hours hours): candidates = habit beliefs
    with confidence >= 0.7, not in S["blocked"] unless confidence > blocked value + 0.15; order no_weekend,
    evening_work, morning_work, block_length, then higher confidence first. Take the first. novelty = "invented" while
    len(S["invented_reverts"]) < 2, else "classic" (do NOT derive it from the meta novelty number). View: classic no_weekend {"type": "workweek"}; classic evening/morning {"type":
    "day", "params": {"focus": "evening" or "morning"}}; classic block_length {"type": "week", "params": {"block_min": m}};
    invented (any belief) {"type": "custom", "params": {"layout": "energy lanes", "belief": key}}. Proposal {"id",
    "title" (e.g. "Hide weekends", "Evening lane"), "reason" = the belief statement + a gentle question ("No weekend
    plans in 10 weeks (0 of 50 items). Hide weekends?"), "view": the spec with hidden_counts, "belief_keys": [key],
    "novelty", "prompt_versions": {agent: active version number}, "status": "shown"}. Append, set last_proposal_at =
    now, add_log "proposal_shown", activity "proposal_shown". No candidate -> no proposal. learn(S) returns
    {"beliefs": all beliefs incl. meta, "proposal": the open proposal or None}. tick(S, on_clock): when on_clock or
    len(S["log"]) - S["learn_mark"] >= 5: set learn_mark, learn beliefs, run the gate.

    PROPOSAL ACTIONS: accept (status shown): proposal["prev_view"] = copy of S["view"], S["view"] = the proposal view,
    status "accepted", add_log "proposal_accepted". undo (status accepted): S["view"] = prev_view, status "reverted",
    S["penalty"][key] += 0.2 and recompute so the belief's confidence drops at once, S["blocked"][key] = new
    confidence, add_log "proposal_reverted"; if novelty was invented: append that log id to S["invented_reverts"],
    meta novelty = round(max(0, novelty - 0.1), 2) (exactly once per invented revert, nowhere else), and when len(S["invented_reverts"]) reaches 2 (then 4, 6 ...) run
    the META-LEARNER. dismiss (status shown): status "dismissed", S["blocked"][key] = confidence, add_log
    "proposal_dismissed". Each action adds activity "proposal_<action>". Returns {"proposal", "view": view_state(S)}.

    META-LEARNER: new designer version = previous active version + 1, same core_hash, learned = previous learned plus
    the line "- Prefer classic views (workweek, week, day): 2 invented views were reverted." (keep at most 12 lines;
    never the words ignore, override or core rules), diff = "+ " + that line, reason "2 invented proposals were
    reverted", evidence = the reverted log ids, replay = {"passed": True, "detail": "learned text checked: <= 12 lines,
    no rule override"} (actually check it), active True; the old version active False. Add a meta belief {"key":
    "prefers_classic", "level": "meta", "statement": "Prefers classic views (2 of 2 invented views reverted)",
    "value": "classic", "confidence": 0.8, "evidence": those log ids}. Activity "prompt_rewrite" with agent
    "designer", text "designer v2: " + diff, and an extra key "diff". rollback(S, agent): the active version goes
    inactive and the version before it becomes active (none before -> keep v1 active); activity "prompt_rollback";
    return {"active": that version}. get_prompts returns every version of every agent.

    ACTIVITY: S["activity"] entries {"at": now, "agent": "learner" | "designer" | "followthrough", "kind", "text"},
    appended in time order; get_activity returns {"events": them}.

    Define every V2 INTERFACE function at module level, plus your own helpers. Check silently that every called name is defined and that every function returns the documented JSON-ready dict.
    Output exactly one artifact: <artifact name="v2_py">...whole file...</artifact> and nothing else.
  expects:
  - v2_py
- name: ui
  kind: llm
  model: crusoe:openai/gpt-oss-120b
  reads:
  - contract
  max_tokens: 16000
  prompt: |-
    You write index.html for this contract (only the endpoints, JSON shapes and element ids matter to you):
    {contract}

    One page, inline CSS and JS, no CDN, 250-350 lines. A frozen harness checks the STATIC file text; the previous
    pages lost points on exactly these, so obey each literally:
    - Element ids, all written in the HTML itself (not created by JS): chat-input (textarea) with a Send button and a
      "Brain dump" checkbox (mode "dump" when checked, else "command"); chat-log; focus; timeline; learned; activity;
      proposal; view-switcher (four buttons month, week, workweek, day -> POST /api/view {"type"}; show
      state.view.hidden_counts as "N hidden on <date>" notes).
    - #focus is a card showing GET /api/focus item title and why, and a <button> whose text is exactly "Start 5 minutes"
      written literally inside the #focus element in the HTML source (it runs a 5:00 countdown).
    - VISIBILITY: the ONLY element that may start hidden is #proposal. Do not write display:none, visibility:hidden or the
      hidden attribute anywhere else, not on #focus, #timeline, #learned, #activity, #chat-log or any parent of them. An
      empty focus shows the text "Nothing to do right now" instead of hiding.
    - STYLESHEET: one <style> block with at least 32 separate rules (selector { ... }), one rule per line, including rules
      for body, header, main, #chat-log, #chat-input, #focus, #focus button, #timeline, #timeline li, #learned,
      #learned li, #activity, #activity li, #proposal, #view-switcher, #view-switcher button, button, button:hover,
      textarea, .msg, .agent, .person, .question, .breakdown, .reminder, .postponed, .checkin, .undo, .plan, .hidden-note,
      .steps, .done. Calm soft colours, rounded cards.
    - SCRIPT (all of these strings must appear literally): an api(method, path, body) helper using fetch and JSON;
      refresh() loads /api/state, /api/focus, /api/beliefs, /api/proposal and /api/activity and re-renders; call refresh()
      after every action and periodically with setInterval(refresh, 5000). A "+1 hour" button POSTs /api/clock with
      {"now": state.now + 60 minutes} (compute the ISO string "YYYY-MM-DDTHH:MM" in JS).
    - chat-log renders every message of state.messages as <div class="msg agent|person <kind>">; breakdown messages list
      their steps; EVERY message with an undo_id gets an Undo button that POSTs /api/undo {"undo_id": m.undo_id}.
    - When the last agent message of kind question/breakdown/checkin has an item_id, the next typed text goes to
      POST /api/chat {"item_id", "text"} instead of /api/command.
    - timeline: items whose start is on state.now's date or the next date, sorted by start, each with a Done button ->
      POST /api/items/<id>/done.
    - learned: GET /api/beliefs statements, each with a Delete button -> DELETE /api/beliefs/<key>, plus state.meta in
      plain words. activity: GET /api/activity events, newest last.
    - proposal card from GET /api/proposal (title, reason) with buttons "Try it" / "Not now" / "Undo" -> POST
      /api/proposals/<id>/accept | dismiss | undo; shown (style.display = "block") only when a proposal is open.
    - A command response with "plan" shows Apply / Undo buttons (POST /api/plan/<id>/apply | undo). An Import box
      (textarea + filename input + button) POSTs /api/import and shows the plan with an Apply button.
    Output exactly one artifact: <artifact name="index_html">...whole file...</artifact> and nothing else.
  expects:
  - index_html
- name: smoke1
  kind: check
  check: app_smoke
  calls: basic
- name: behaviour
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  reads:
  - contract
  - blackboard.smoke1
  - artifact.app_py
  max_tokens: 32000
  prompt: |-
    You are stage 2 of the STAGED BUILD. Contract:
    {contract}

    Smoke report of stage 1 (app.py + v2.py run together; if it names a v2.py problem, leave it: a fixer handles v2.py):
    {blackboard.smoke1}

    Stage 1 app.py:
    {artifact.app_py}

    Re-emit the whole app.py: fix what the smoke report names in app.py, then add CHAT, the breakdown builder, CLOCK + SCHEDULER (with the LOGGING calls and v2.tick(S, True) at the end) and selftest() run by the --selftest flag, exactly as your system message says. Keep every V2 INTERFACE route and call. Follow DATETIME SAFETY in every new line.
    Output exactly one artifact: <artifact name="app_py">...whole file...</artifact> and nothing else.
  expects:
  - app_py
- name: smoke
  kind: check
  check: app_smoke
  calls: v2
  selftest: true
- name: fixer
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  reads:
  - contract
  - blackboard.smoke
  - artifacts
  max_tokens: 32000
  prompt: |-
    The team's app (app.py + v2.py + index.html) was just started by the smoke check, which also ran `python app.py --selftest`. Its report:
    {blackboard.smoke}

    If the report starts with "SMOKE: PASS", output only the word NO_CHANGE. Otherwise find the ROOT cause of every compile error, traceback, selftest failure, HTTP 500 or wrong JSON shape (read the last frames of the traceback and the named file and line), fix it in the source, and check the same mistake is not repeated elsewhere (every datetime(...) call, every v2.<name> call against the V2 INTERFACE list, every name used but never defined). A missing or empty file must be written in full from the spec in your system message and the contract. A traceback from selftest() means the bug is in the app code it called: fix that code, never delete or weaken selftest(). Keep all behaviour that already works; do not rename functions, endpoints or V2 INTERFACE names.
    Re-emit ONLY the files that need a change (usually one), each whole, as <artifact name="...">...</artifact> with the existing names (app_py, v2_py, index_html). Do not re-emit a file the report does not implicate.
- name: rescue
  kind: llm
  model: claude:haiku
  reads:
  - contract
  - blackboard.smoke
  - artifacts
  max_tokens: 32000
  prompt: |-
    The team's app (app.py + v2.py + index.html) was just started by the smoke check, which also ran `python app.py --selftest`. Its report:
    {blackboard.smoke}

    If the report starts with "SMOKE: PASS", output only the word NO_CHANGE. Otherwise find the ROOT cause of every compile error, traceback, selftest failure, HTTP 500 or wrong JSON shape (read the last frames of the traceback and the named file and line), fix it in the source, and check the same mistake is not repeated elsewhere (every datetime(...) call, every v2.<name> call against the V2 INTERFACE list, every name used but never defined). A missing or empty file must be written in full from the spec in your system message and the contract. A traceback from selftest() means the bug is in the app code it called: fix that code, never delete or weaken selftest(). Keep all behaviour that already works; do not rename functions, endpoints or V2 INTERFACE names.
    Re-emit ONLY the files that need a change (usually one), each whole, as <artifact name="...">...</artifact> with the existing names (app_py, v2_py, index_html). Do not re-emit a file the report does not implicate.
workflow:
- parallel:
  - core
  - v2
  - ui
- smoke1
- behaviour
- smoke
- loop:
    body:
    - fixer
    - smoke
    max_rounds: 2
    stop_when: 'SMOKE: PASS'
    check_first: true
- loop:
    body:
    - rescue
    - smoke
    max_rounds: 1
    stop_when: 'SMOKE: PASS'
    check_first: true
artifacts:
- name: app_py
  format: text
- name: v2_py
  format: text
- name: index_html
  format: text
outputs:
  answer: artifact.app_py
