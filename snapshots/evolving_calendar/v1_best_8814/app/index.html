<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolving Calendar — Iris</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0;
    background: #f7f5f0;
    color: #2d2d2d;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #ffffff;
    border-bottom: 1px solid #e4dcd0;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    color: #5c4a3a;
    font-weight: 600;
    letter-spacing: 0.4px;
  }
  main {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.agent {
    background: #eef3ea;
    color: #2d3a2d;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.person {
    background: #ffffff;
    color: #2d2d2d;
    align-self: flex-end;
    border: 1px solid #d8d0c0;
    border-bottom-right-radius: 4px;
  }
  .msg.system {
    background: #f3efe9;
    color: #6b5b4b;
    align-self: center;
    font-size: 12px;
    padding: 6px 10px;
    max-width: 90%;
    text-align: center;
    border-radius: 8px;
  }
  .steps {
    margin-top: 8px;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.5;
  }
  .steps li { margin: 4px 0; }
  .actions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    background: #7a8b6a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: #6d7c5d; }
  button.secondary { background: #c9c2b4; color: #3d352d; }
  button.secondary:hover { background: #bcb4a4; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .composer {
    background: #ffffff;
    border-top: 1px solid #e4dcd0;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #chat-input {
    flex: 1;
    min-height: 44px;
    padding: 10px 14px;
    border: 1px solid #d8d0c0;
    border-radius: 10px;
    font: inherit;
    font-size: 14px;
    resize: vertical;
  }
  .focus-card {
    background: #ffffff;
    border: 1px solid #e4dcd0;
    border-radius: 12px;
    padding: 14px 18px;
    margin: 0 20px 12px 20px;
    font-size: 14px;
  }
  .focus-card h2 {
    margin: 0 0 6px 0;
    font-size: 15px;
    color: #5c4a3a;
  }
  .focus-card .why {
    color: #6b5b4b;
    font-style: italic;
    margin: 0 0 10px 0;
  }
  .focus-card .empty {
    color: #9a8c78;
    font-style: italic;
  }
  .timer {
    display: inline-block;
    margin-left: 10px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 13px;
    padding: 2px 8px;
    background: #f3efe9;
    border-radius: 6px;
    color: #5c4a3a;
  }
  .timeline {
    background: #ffffff;
    border-top: 1px solid #e4dcd0;
    padding: 12px 20px;
    font-size: 13px;
  }
  .timeline h3 {
    margin: 0 0 8px 0;
    font-size: 13px;
    color: #8a7a66;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tl-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #f3efe9;
  }
  .tl-item:last-child { border-bottom: none; }
  .tl-time { color: #6b5b4b; min-width: 70px; font-size: 12px; }
  .tl-title { flex: 1; }
  .error {
    color: #a34a3a;
    font-size: 12px;
    margin-top: 6px;
    display: none;
  }
  .dump-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #6b5b4b;
    cursor: pointer;
  }
  .dump-label input { accent-color: #7a8b6a; }
</style>
</head>
<body>
<header>
<h1>Evolving Calendar</h1>
</header>
<main>
<div class="chat-log" id="chat-log"></div>
<div class="composer">
<label class="dump-label">
<input type="checkbox" id="dump-mode"> Brain dump
</label>
<textarea id="chat-input" rows="1" placeholder="Type something… (e.g. "dentist thursday 3pm")"></textarea>
<button id="send-btn">Send</button>
</div>
<div class="focus-card" id="focus">
<h2 id="focus-title">—</h2>
<p class="why" id="focus-why"></p>
<div class="actions" id="focus-actions"></div>
</div>
<div class="timeline" id="timeline">
<h3>Today &amp; tomorrow</h3>
<div id="timeline-list"></div>
</div>
</main>
<div class="error" id="error"></div>
<script>
const API = "";
let pendingItemId = null;
let timerInterval = null;

function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

async function json(path, method, body){
  const opts = { method, headers: {"Content-Type": "application/json"} };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try { const j = await r.json(); if (j.error) msg = j.error; } catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

function fmt(iso){
  if (!iso) return "";
  const d = new Date(iso + "Z");
  return d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
}
function dayLabel(iso){
  if (!iso) return "";
  const d = new Date(iso + "Z");
  return d.toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"});
}

function renderMessage(m){
  const div = document.createElement("div");
  div.className = "msg " + (m.role === "agent" ? "agent" : m.role === "person" ? "person" : "system");
  let html = esc(m.text || "");
  if (m.kind === "breakdown" && m.steps && m.steps.length){
    html += "<ul class='steps'>" + m.steps.map(s => "<li><strong>" + esc(s.title) + "</strong> — " + esc(s.estimate_min) + " min</li>").join("") + "</ul>";
  }
  const acts = document.createElement("div");
  acts.className = "actions";
  if (m.undo_id){
    const b = document.createElement("button");
    b.className = "secondary";
    b.textContent = "Undo";
    b.onclick = () => doUndo(m.undo_id);
    acts.appendChild(b);
  }
  div.innerHTML = html;
  div.appendChild(acts);
  return div;
}

async function load(){
  try {
    const st = await json("/api/state", "GET");
    const log = document.getElementById("chat-log");
    log.innerHTML = "";
    (st.messages || []).forEach(m => log.appendChild(renderMessage(m)));
    log.scrollTop = log.scrollHeight;
    await renderFocus();
    await renderTimeline(st.now, st.items);
  } catch(e){
    showError(e.message);
  }
}

async function renderFocus(){
  try {
    const f = await json("/api/focus", "GET");
    const card = document.getElementById("focus");
    const titleEl = document.getElementById("focus-title");
    const whyEl = document.getElementById("focus-why");
    const acts = document.getElementById("focus-actions");
    acts.innerHTML = "";
    if (!f.item){
      titleEl.textContent = "Nothing planned right now.";
      whyEl.textContent = "";
      card.classList.add("empty");
      return;
    }
    card.classList.remove("empty");
    titleEl.textContent = f.item.title || "(untitled)";
    whyEl.textContent = f.why ? ("Why: " + f.why) : "";
    if (f.action){
      const b = document.createElement("button");
      b.textContent = f.action;
      b.onclick = () => startTimer();
      acts.appendChild(b);
    }
  } catch(e){
    showError(e.message);
  }
}

async function renderTimeline(nowIso, items){
  const list = document.getElementById("timeline-list");
  list.innerHTML = "";
  if (!nowIso) return;
  const today = nowIso.slice(0,10);
  const d = new Date(today + "T00:00:00Z");
  d.setDate(d.getDate() + 1);
  const tomorrow = d.toISOString().slice(0,10);
  const relevant = (items || []).filter(it => it.start && (it.start.slice(0,10) === today || it.start.slice(0,10) === tomorrow));
  relevant.sort((a,b) => (a.start||"").localeCompare(b.start||""));
  if (relevant.length === 0){
    list.innerHTML = "<div style='color:#9a8c78;font-style:italic'>Nothing on today or tomorrow.</div>";
    return;
  }
  relevant.forEach(it => {
    const div = document.createElement("div");
    div.className = "tl-item";
    const time = document.createElement("div");
    time.className = "tl-time";
    time.textContent = (it.start ? fmt(it.start) : "—") + " " + (it.window ? "(" + esc(it.window) + ")" : "");
    const title = document.createElement("div");
    title.className = "tl-title";
    title.textContent = esc(it.title || "") + (it.kind ? " [" + it.kind + "]" : "");
    const b = document.createElement("button");
    b.className = "secondary";
    b.textContent = "Done";
    b.onclick = () => markDone(it.id);
    div.appendChild(time);
    div.appendChild(title);
    div.appendChild(b);
    list.appendChild(div);
  });
}

async function sendCommand(text, mode){
  try {
    const res = await json("/api/command", "POST", {text, mode});
    pendingItemId = null;
    showError("");
    await load();
  } catch(e){
    showError(e.message);
  }
}

async function sendChat(itemId, text){
  try {
    const res = await json("/api/chat", "POST", {item_id: itemId, text});
    await load();
  } catch(e){
    showError(e.message);
  }
}

async function markDone(id){
  try {
    await json("/api/items/" + encodeURIComponent(id) + "/done", "POST", {});
    await load();
  } catch(e){
    showError(e.message);
  }
}

async function doUndo(undoId){
  try {
    await json("/api/undo", "POST", {undo_id: undoId});
    await load();
  } catch(e){
    showError(e.message);
  }
}

function showError(msg){
  const el = document.getElementById("error");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

function startTimer(){
  let left = 5 * 60;
  const b = document.querySelector("#focus-actions button");
  if (b) { b.disabled = true; b.textContent = "Counting…"; }
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    left--;
    const m = Math.floor(left / 60);
    const s = left % 60;
    document.getElementById("focus-title").textContent = "Focus: " + (document.getElementById("focus-title").textContent.replace(/^Focus: /,"")) + " — " + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    if (left <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      if (b){ b.disabled = false; b.textContent = "Start 5 minutes"; }
      load();
    }
  }, 1000);
}

document.getElementById("send-btn").addEventListener("click", async () => {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  const mode = document.getElementById("dump-mode").checked ? "dump" : "command";
  if (pendingItemId){
    await sendChat(pendingItemId, text);
  } else {
    await sendCommand(text, mode);
  }
});

document.getElementById("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    document.getElementById("send-btn").click();
  }
});

load();
setInterval(load, 8000);
</script>
</body>
</html>
