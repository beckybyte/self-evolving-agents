mechanism: rendered ui review
notes: 'One-screen UI spec of child 1, plus a UI review driven by the rendered page: the smoke check renders the page (render:
  true) and a cheap ui_review role (gpt-oss) compares the visible text and index.html with the v3.2 look-and-feel rubric and
  the layout spec, then fix_ui repairs only those lines. The Python auditor reads only the .py files. Evidence: the judge
  (0.57) found layout faults the behaviour auditor never looks at.'
soul: |
  You are part of a small team writing one Python 3.12 app (standard library only) against a frozen contract.
  Always emit complete files inside <artifact name=...> tags, never fragments or diffs. Simulated clock only.
  The app is rule-based: it must work with no language model at all. The spec below is binding.

  BUILD RULES (the previous team lost almost every point to crashes, not to logic: a missing method, a NameError at
  startup, a handler that dropped the connection. The parent build passed v1 (behaviours 1-9) almost fully and lost
  nearly all its remaining points on v2 (behaviours 10-21), which nobody had specified: the V2 sections below fix that).
  - THREE Python files: app.py holds the v1 server (store, parsing, conversations, scheduler, focus, HTTP), v2.py
    the v2 learning loop (log, plans, imports, beliefs, proposals, views, knobs, prompts, activity) and v3.py the v3
    view catalog, critic and designer, joined ONLY by the V2 and V3 INTERFACE below. No other files, no imports beyond
    the standard library (app.py does `import v2` and `import v3`, v2.py does `import v3`).
    The parent build passed v1 and v2 almost fully and lost all its remaining points on v3 (behaviours 22-26), which
    nobody had specified: the V3 sections below fix that.
    Every function you call must be defined in the file that calls it (or be a V2 INTERFACE function called as
    v2.<name>); re-read every name before you finish. Start with `python app.py --port P --data D` via argparse; os.makedirs(D, exist_ok=True);
    ThreadingHTTPServer on 0.0.0.0; one global threading.Lock held during each request.
  - do_GET / do_POST wrap everything in try/except and ALWAYS answer JSON (status 200 for success, 400/404/500 with
    a JSON object with key "error" otherwise) with Content-Type and Content-Length. Never let an exception escape a handler.
  - GET / serves index.html from the app.py directory; if that file is missing, serve a small built-in page that still
    has the ids chat-input, chat-log, focus, timeline.
  - State is plain dicts/lists (items, messages, conversation state per item id, undo records, sent-reminder keys,
    now). Saving a JSON copy under --data is optional; if you save, never let it fail a request.
  - Times: parse and format with datetime.strptime/strftime "%Y-%m-%dT%H:%M". Never use the real clock.

  DATETIME SAFETY (the previous build crashed in BOTH runs on one line and lost every postpone, check-in and
  breakdown-accept check: HTTP 500 "'datetime.date' object cannot be interpreted as an integer", from
  datetime(day.year, day.month, day, hour, 0) in the free-slot finder, passing a date object as the day number).
    - Import "from datetime import datetime, date, time as dtime, timedelta". Build a datetime from a date d ONLY with
      datetime.combine(d, dtime(h, m)). Never call datetime(...) with a date or datetime object as an argument.
    - Name every date-only variable with a _d suffix (day_d, deadline_d) and every datetime with _dt; compare like
      with like (datetime with datetime, date with date); turn a datetime into its date with .date().
    - Items store times as ISO strings; parse with parse_iso only where you need arithmetic, store back with fmt_iso.

  STATE SHAPES
  - Item: every key of the contract Item always present (missing seed fields get defaults: window/why/parent_id/
    estimate_min/start/end None, status "open", postpone_count 0, source "seed"). Seed items keep their ids.
  - Message: always all keys id, role, kind, text, item_id, at (= simulated now), undo_id; key "steps" ONLY on kind
    "breakdown". One helper add_agent(kind, text, item_id=None, undo_id=None, steps=None) appends and returns it.
  - Every response's "messages" lists the new messages of that request (person messages may be included, agent
    messages must be). EVERY /api/reset, /api/command, /api/chat MUST produce at least one agent message:
    reset adds a warm agent "info" greeting ("Hi, I'm here whenever you want to plan a little."); command replies
    with an "info" confirmation naming what was added (plus the complexity question when relevant).

  NO-GUILT WORDING: no agent text may contain these substrings (case-insensitive): overdue, fail, miss, late,
  behind, should have, forgot, lazy, urgent, alert. Note "later", "dismiss", "relate" contain banned substrings:
  do not use them. Run every agent text through a check that replaces any banned phrase with a kind one.

  PARSING (rules only, no model needed)
  - Date words: today, tomorrow, weekday names (monday..sunday, also mon..sun) = the soonest such date after today
    (2026-10-19 is a Monday, so "thursday" -> 2026-10-22), "Friday, October 23" / "October 23" / "Oct 23" /
    "2026-10-23" -> that date. No date word -> today if the time is still ahead, else tomorrow.
  - Clock times: "3pm", "3 pm", "3:30pm", "15:00", "at 9" (1..7 without am/pm means pm). A clear clock time makes an
    "event": start = date+time, end = start + 60 min, window None.
  - Soft windows keep their words in `window` and get an approximate start/end on that date: "around noon"/"noon"/
    "lunch" 12:00-13:00, "morning" 09:00-12:00, "afternoon"/"this afternoon" 14:00-17:00, "evening" 18:00-21:00,
    "tonight" 20:00-22:00. Such an item is an event if it is an appointment with someone (with/meet/lunch/dinner/call
    with), else a task. "lunch with Ana around noon tomorrow" -> window "around noon", start 2026-10-20T12:00.
    - Date words may come before or after the time phrase ("lunch with Ana around noon tomorrow", "tomorrow lunch
      with Ana around noon"): find the date word anywhere in the text first, remove it, then the time/window; the date
      applies to windows too (that example -> start 2026-10-20T12:00, window "around noon", title "Lunch with Ana").
      The title never keeps date or time words (no "tomorrow", "thursday", "3pm", "around noon").
  - Title: the text with the date/time words removed, first letter capitalised ("Dentist", "Lunch with Ana").
  - No time at all -> kind "task" with start/end None ("maybe ..." or ending in "?" -> kind "note"). Source "typed".
  - Dump mode: split on commas, semicolons and newlines (not on "and"); every non-empty fragment becomes exactly one
    item, source "dump", title keeps the fragment's main words (strip "maybe", "?"). Reply with ONE info message listing
    the titles, plus AT MOST ONE question in the whole response (the complexity question of the first big fragment,
    if any; e.g. "portfolio" is big).

  COMPLEXITY CHECK (rule 3): a new task is big/vague when its text contains a VAGUE VERB PHRASE: work on, figure out,
  deal with, sort out, sort through, handle, tackle, get on top of, catch up on, clean out, clean up, get ... together,
  get ... done, get ... sorted, organize, organise, plan, prepare, research, finish, start on, apply for, overhaul,
  redo, revamp; or a BIG NOUN: project, portfolio, pitch deck, deck, thesis, website, garage, closet, inbox, taxes,
  application, claim, move, renovation, novel; or estimate_min > 120 (match whole words: "plan" must not match "plants";
  "call mom", "buy milk", "dentist thursday 3pm" stay small). Hidden scenarios use OTHER vague verbs and nouns than the
  examples, so keep the list broad. Then add exactly ONE agent message kind "question", item_id = the item, text like "This one
  sounds big. Want me to break 'Get my portfolio together' into small steps?" and set convo[item_id] = "ask_split".
  Nothing is broken down and no child is created without a yes.

  CHAT (/api/chat, convo state machine per item id; one question per message, each text holds exactly one "?")
  - yes words: yes, yeah, yep, yup, sure, ok, okay, alright, please, looks good, sounds good, good, great, perfect,
    fine, do it, go ahead, let's, works, that works, why not, of course, absolutely, love it, nice, deal, cool,
    awesome, agreed, go for it, sounds right, all good, add them, thanks, thank you, y.
    no words: no, nope, nah, not now, not right now, no thanks, later, rather not, don't (checked BEFORE yes words; "no thanks, not right now" is a no).
  - ask_split: no -> info "Okay, I'll keep it as one task." state None. yes -> question "Why does this matter to you?"
    state ask_why. Anything else (neither a no nor a yes word: "hmm", "what do you mean?", "maybe") -> ONE
    question "No pressure. Shall I break it into small steps, yes or not now?", state stays ask_split, streaks
    unchanged. EXPLICIT YES RULE (a user simulator checks it on every episode; the parent broke it 14 times): nothing
    is broken down, no child is created and nothing is deleted unless the person's latest reply has a yes word.
  - ask_why: store the reply text as the item's why (exact text) -> question "What does done look like for you?"
    -> ask_done (store reply) -> question "Is there a deadline, a day you'd like it finished by?" -> ask_deadline: parse a
    date from the reply (rules above; none -> now + 7 days) -> breakdown message -> state propose.
  - Breakdown message: kind "breakdown", item_id = goal, text "Here's a gentle plan for '<title>'. Does this look ok?",
    steps = 3 or 4 dicts with keys "title" and "estimate_min". Each title starts with a concrete verb from: List, Pick, Write,
    Open, Collect, Choose, Draft, Email, Call, Book, Clear, Sort, Find, Gather, Send, Review, Update, Upload, Read.
    First step estimate 10 (<= 15), the others 30-60. Build them from the goal title (for a portfolio: "List the
    projects you are proudest of" 10, "Pick the five best projects" 30, "Write a short note for each project" 60,
    "Upload the projects to a simple website" 60); generic fallback: "Open a note and list what '<title>' needs" 10,
    "Pick the first piece to start" 20, "Draft the first piece" 45, "Review it and send or save it" 30.
  - propose: ACCEPT only when the reply has a yes word and no change word. A reply with a change word (change words: change, different, smaller,
    shorter, fewer, more, less, instead, rather, swap, replace, split, too big, too long, too much, but) -> a revised
    "breakdown" (smaller steps, max 5), stay. A no word -> info "Okay, I'll keep it as one task.", state None, no
    children. Anything else -> ONE question "Shall I add these steps to your calendar?", stay. So "yes",
    "looks good", "ok", "that works for me", "fine by me", "perfect, thanks" all ACCEPT (the previous build ignored
    "that works for me" and lost every child-task check). On accept create one task per step: parent_id goal id, source "agent", estimate_min, start/end
    scheduled one per day starting today (or tomorrow if today's slot has passed) at the person's usual hour
    (see SCHEDULER), end = start + estimate, all strictly before the deadline date (if the days run out, place the
    rest back to back on the last day before the deadline). Goal why stays set. Info message "Done, the first tiny step
    is '<step 1>'." state None.
  - checkin (state after a check-in): text with big/smaller/break/too much -> immediately send a "breakdown" message
    for that item (state propose); time/busy/wrong -> move it to the next day's free slot, info naming the new time;
    not needed/drop/remove/don't need -> question "Shall I remove '<title>' for you?" state confirm_drop; in
    confirm_drop a yes word -> delete the item, info; anything else -> keep it, info "Okay, I'll keep '<title>'.".
  - ONE QUESTION AT A TIME (checked by the user simulator on every response): every agent text holds at most ONE
    "?"; every response (command, dump, chat, clock) holds at most ONE agent message that asks something (kind
    question, checkin or breakdown, or any text with "?"). Info lists never contain "?" (strip it from titles).

  DONE / UNDO: /api/items/<id>/done sets status "done", returns the JSON object with key "item". Undo records map undo_id -> the
  item's previous start, end, window, postpone_count; /api/undo restores them, returns ok true.

  CLOCK + SCHEDULER (/api/clock): if new <= now just return an empty "messages" list. Otherwise visit only the DUE MOMENTS t between
  now (exclusive) and new (FAST CLOCK AND STARTUP below), in time order; at each t, for every open item (status "open") in a stable order:
  - Reminder at start: start is not None and start == t (crossed this minute), key (id,"start",start) not yet sent ->
    "reminder" message "It's time for '<title>' (20:00)." Reminder before end: end - 10 min == t and key (id,"end",end)
    not sent -> "reminder" "'<title>' wraps up in 10 minutes." Done items never get reminders. No duplicates ever.
  - Auto-postpone (kind "task" only, not goals with children; end None -> start + 60 min; no start -> skip): CATCH-UP
    rule t >= end + 31 min (NOT t == end + 31: a task that was already past at reset or before the previous clock call
    must still be followed up on the next clock call; the user simulator flagged 16 tasks nobody followed up). If
    postpone_count >= 2 -> do NOT move it; send ONE "checkin" message (exactly one "?"): "'<title>' has moved a few
    times, and that's okay. Shall I break it into smaller steps, find a better time, or let it go?" set convo state
    "checkin", mark key (id, "checkin", end) so it is never repeated. At most ONE checkin per /api/clock response: a
    second one due in the same call is NOT marked and fires on the next clock call. Else move it: new day = end's date +
    1 (if that day is before t's date, t's date; the new start must be after t), same length, the free slot (same day-scan the breakdown scheduler uses)
    that starts at or after the person's usual hour (try every 15 minutes up to 23:30; free = no open item with
    start/end overlaps it), else the first free slot from 08:00 that day. postpone_count += 1, store an undo record,
    send "postponed" message with undo_id: "No worries, I moved '<title>' to Tue Oct 20 at 21:30. Undo if you'd
    rather keep it." (always the task title and the HH:MM time).
  - Usual hour: from seed items with status "done" and a start, take the lower median start time and round down to the
    hour (Iris: 20:00). No history -> 19:00.
  - Set now = new at the end; return the new messages in order.

  FOCUS (/api/focus): goals = open items with a non-empty why; their open children (parent_id = goal id). If any:
  item = the open child with the earliest start (None last, then insertion order) across those goals, parent = its
  goal, why = goal why. Else item = the open task (no children of its own) with the earliest start, parent from its
  parent_id (or None), why = the parent's why, else the item's own why. "action" is always "Start 5 minutes".
  No open item -> item None, parent None, why None.

  V2 INTERFACE (app.py <-> v2.py). The two files are written by different writers at the same time and neither sees
  the other's code, so BOTH follow this list exactly (names, arguments, return shapes).
  - app.py keeps ONE global dict STATE. Keys app.py owns: "now" (ISO str), "items" (list of full Item dicts, every
    contract key present; v2 may add keys "uid" and "recurrence" to imported items), "messages" (list of full Message
    dicts), "convo", "undo", "sent". "undo" maps undo_id -> {"item_id", "start", "end", "window", "postpone_count"};
    /api/undo restores exactly those fields onto that item (v2 writes such records too for its moves).
  - v2.py NEVER imports app.py. Every v2 function takes that dict as first argument S, changes it in place and
    returns a JSON-ready dict. Unknown ids raise KeyError (app.py answers 404 JSON). v2 makes its own messages with
    the full Message shape, appends them to S["messages"] and returns them; v2 has its own wording check.
  - The functions (v2.py defines all of them, app.py calls them):
      init_v2(S)                        do_reset calls it right after loading the seed items (it sets the v2 keys)
      add_log(S, kind, item_ids, payload, source) -> LogEntry   app.py calls it for every v1 action (see LOGGING)
      handle_command(S, text) -> dict or None   /api/command in mode "command" calls it FIRST; a dict is the whole
                                        response ({"messages", "created", and "plan" for a preview}); None = not a
                                        query/move/cancel/bulk command, so app.py parses it as a new item as usual
      import_file(S, filename, content) -> {"plan"}
      apply_plan(S, plan_id) -> {"plan"};  undo_plan(S, plan_id) -> {"plan"}
      get_log(S) -> {"entries"};  get_beliefs(S) -> {"beliefs"};  delete_belief(S, key) -> {"ok": True}
      learn(S) -> {"beliefs", "proposal"};  get_proposal(S) -> {"proposal"}
      proposal_action(S, proposal_id, action) -> {"proposal", "view"}   action = accept | dismiss | undo
      set_view(S, view_type) -> {"view"};  get_prompts(S) -> {"prompts"};  rollback(S, agent) -> {"active"}
      get_activity(S) -> {"events"};  view_state(S) -> View spec;  meta_state(S) -> the meta dict
      tick(S, on_clock)                 app.py calls tick(S, True) at the end of /api/clock and tick(S, False) at the
                                        end of every other request that added log entries
  - app.py routes: GET /api/log, /api/beliefs, /api/proposal, /api/prompts, /api/activity; POST /api/import (body
    filename, content), /api/plan/<id>/apply, /api/plan/<id>/undo, /api/learn, /api/proposals/<id>/<action>,
    /api/view (body type), /api/prompts/<agent>/rollback; DELETE /api/beliefs/<key> (a do_DELETE method with the same
    try/except JSON wrapper). /api/state also returns "view": v2.view_state(S) and "meta": v2.meta_state(S).
  - LOGGING (app.py side, via v2.add_log, at = simulated now): "create" for each item created by /api/command
    (source "typed" or "dump", item_ids [id]); "done" (source "person"); "chat" for /api/chat, or "checkin_answer"
    when that item's convo state was "checkin" or "confirm_drop" (source "person"); "postponed" and "reminder" for
    every postponed/reminder message (source "clock", item_ids [id]); "update" for /api/undo and when a check-in
    moves an item; "delete" when a check-in drop removes an item.

  V3 INTERFACE (v3.py: catalog, critic and designer of behaviours 22-23, written by its own writer at the same time as
  app.py, v2.py and index.html; nobody sees the others' code, so all follow this list exactly).
  - v3.py imports only the standard library (json, re, copy, datetime), never app.py or v2.py. Every function takes the
    STATE dict S first and only READS it (S["now"], S["items"], S.get("beliefs", {})). Functions:
      get_catalog(S) -> {"primitives": [...]}          critic(S, spec) -> {"ok", "problems", "repaired"}
      design(S, belief_key) -> {"drafts", "critique", "repairs", "chosen", "proposal": None}
      best_spec(S, belief_key) -> the chosen draft spec  hidden_counts(S, spec) -> {date: n} (items the spec hides)
  - v2.py does `import v3` and calls v3.best_spec (invented proposals) and v3.hidden_counts (custom views).
  - app.py does `import v3` and routes: GET /api/catalog -> v3.get_catalog(S); POST /api/critic {"spec"} ->
    v3.critic(S, body.get("spec")); POST /api/design {"belief_key"} -> r = v3.design(S, body.get("belief_key")), then
    r["proposal"] = v2.learn(S)["proposal"] (runs the gate, which may open an invented proposal), answer r.
  - V3 STATE: v2.init_v2 adds S["meta"]["threshold"] = 0.7 (meta keys: novelty, cadence_hours, breakdown_appetite,
    tone, threshold). app.py owns S["streak_yes"] = S["streak_no"] = 0 (set on every reset) and reads/writes
    S["meta"]["breakdown_appetite"] (APPETITE below).

  APPETITE (behaviour 26, convo.py). In the ask_split state a no-word reply -> S["streak_no"] += 1,
  S["streak_yes"] = 0, S["meta"]["breakdown_appetite"] = round(max(0.0, appetite - 0.15), 2); a yes reply ->
  S["streak_yes"] += 1, S["streak_no"] = 0, appetite = round(min(1.0, appetite + 0.15), 2) (3 declines: 0.5 -> 0.05,
  3 accepts: 0.5 -> 0.95). The COMPLEXITY CHECK of every new big task (command and dump) looks at them first:
    - S["streak_no"] >= 3 or appetite <= 0.1 -> NO question and no breakdown: only the usual info reply, kept as one task.
    - elif S["streak_yes"] >= 3 or appetite >= 0.9 -> no question: send the "breakdown" message for it straight away
      (breakdown builder, deadline now + 7 days, convo state "propose", so "looks good" creates the steps).
    - else the usual single question (convo "ask_split").

  CONVO SPLIT (this team has NO staged build and NO selftest; it overrides "THREE Python files" above). SIX files,
  all written at the same time by different writers who never see each other's code, joined only by the interfaces:
  app.py, convo.py, v2.py, commands.py, v3.py, index.html.
  - app.py: imports (`import v2, v3, commands, convo`), time helpers, store, add_agent, wording check, PARSING, the
    COMPLEXITY CHECK detection (is_big(text, item)), reset/state/command/done/undo/focus endpoints, every V2 / V3 /
    COMMANDS route, the LOGGING calls for create/done/undo, the HTTP handler and main(). It does NOT contain the chat
    state machine, the breakdown builder or the scheduler.
  - convo.py: the CHAT state machine, the breakdown builder, APPETITE, CLOCK + SCHEDULER (reminders, auto-postpone,
    check-in, free-slot finder, usual hour) and their LOGGING calls. It imports only the standard library and `import v2`
    (v2.add_log, v2.tick); never app.py. Its own helpers: parse_iso / fmt_iso, a no-guilt wording check, a deadline
    parser (today, tomorrow, weekday names, "Friday, October 23", "October 23", "Oct 23", "Nov 6", "2026-11-06", none ->
    now + 7 days), and msg(S, kind, text, item_id=None, undo_id=None, steps=None) which appends a full Message
    (id "c_" + uuid4().hex[:10], role "agent", at S["now"], "steps" only on breakdown) to S["messages"] and returns it.
  - CONVO INTERFACE (S is app.py's STATE dict; convo changes it in place):
      convo.reset(S)                         app.py's do_reset calls it after loading the seed: sets S["convo"] = {},
                                             S["sent"] = {} (keys are strings like "id|start|2026-10-19T20:00"),
                                             S["streak_yes"] = S["streak_no"] = 0.
      convo.on_big_task(S, item) -> [msgs]   app.py calls it for the FIRST big/vague task created by a command or dump
                                             (at most one per request); it applies APPETITE (question, straight
                                             breakdown, or nothing) and sets S["convo"][item id].
      convo.chat(S, item_id, text) -> {"messages"}   the whole /api/chat (unknown item -> KeyError); it appends the
                                             person message ONCE (app.py adds NO person message for /api/chat:
                                             the parent showed every reply twice); logs "chat" or
                                             "checkin_answer" and calls v2.tick(S, False).
      convo.clock(S, new_iso) -> {"messages"}        the whole /api/clock (new <= now -> empty list, now unchanged); sets
                                             S["now"] = new_iso at the end, logs postponed/reminder, calls v2.tick(S, True).
      convo.usual_hour(S) -> int             lower-median start hour of seed items with status done, else 19.
  - Undo records written by convo (postpone, check-in move) use the UNDO EXACT shape in S["undo"]; app.py's /api/undo
    restores them. S["meta"]["breakdown_appetite"] is read and written by convo (v2.init_v2 creates S["meta"]).

  COMMANDS SPLIT (overrides the V2 INTERFACE for four functions; the parent's failures were all in this part of a 1200-line
  v2.py: bulk affected [], TZID times, re-import dedup). handle_command, import_file, apply_plan and undo_plan are defined in
  commands.py (module `commands`, its own writer), NOT in v2.py. app.py does `import commands` and calls
  commands.handle_command(S, text), commands.import_file(S, filename, content), commands.apply_plan(S, plan_id) and
  commands.undo_plan(S, plan_id) with the same arguments and returns as the V2 INTERFACE says. commands.py does `import v2`
  and uses only v2.add_log; v2.py and v3.py never import commands. Selftest asserts for bulk / query / move / cancel /
  import name "commands.py:".

  UNDO EXACT (a user simulator checks it on every episode; the parent broke it 4 times in 40 episodes): every undo
  record stores a FULL deep copy of the item before the change ({"item_id", "before": copy.deepcopy(item)}, plus the
  old start/end/window/postpone_count keys for compatibility). /api/undo puts that copy back as the item (every field,
  same position in the items list; a deleted item is re-inserted at its old index) and marks the record used, so a
  second undo of the same id answers {"ok": true} and changes nothing. Every message that changes an item (postponed, check-in move, typed
  move) carries an undo_id. Plan undo re-inserts deleted items at their original index with every original field and
  removes the created ones. After an undo, items/messages/plans compare equal to before the change.

  FAST CLOCK AND STARTUP (the parent's smoke reported "app did not start" in one run: selftest took 16 s and the fixer
  re-sent the same app.py three times): /api/clock never walks minute by minute. It collects the due moments between
  old and new now (each open item's start, end - 10 min and end + 31 min, plus catch-up for times already past), sorts
  them and processes them in order (ties in item order), then calls v2.tick once at the end. main() parses arguments
  and starts serving at once: nothing slow before serve_forever, selftest() only behind --selftest. selftest() must
  finish in under 3 s.
specs:
  ui_layout: |+
    ONE-SCREEN APP SHELL (desktop ~1400 x 900 px; CSS grid, never one long column; nothing below the fold)
    - `*, *::before, *::after { box-sizing: border-box; }`; html, body { height: 100%; margin: 0; }; body is a grid with
      grid-template-rows: 56px minmax(0, 1fr); height: 100vh; overflow: hidden. Nothing wider than the viewport
      (overflow-wrap: anywhere on bubbles and rows; rows are flex with gap 8px, the text part flex: 1; min-width: 0).
    - <header> (56px, white, bottom border, padding 0 24px, flex, align-items center, space-between): "Evolving Calendar"
      (17px, 600) on the left; on the right the clock from state.now via fmtClock in a soft pill, small outline buttons
      "+30 min", "+1 h", "Next morning" (next day 08:00) that POST /api/clock {"now": "YYYY-MM-DDTHH:MM"} computed with the
      helpers, and an accent button "Start as Iris" which POSTs /api/reset with a const IRIS seed written in the script: now
