- name: commands
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  reads:
  - contract
  max_tokens: 24000
  prompt: |-
    You write commands.py: typed CRUD commands, bulk previews, plans and imports of this contract (behaviours 10-13), behind the COMMANDS SPLIT of your system message. app.py and v2.py are written by others at the same time. Contract:
    {contract}

    COMMANDS SPEC (commands.py, rule-based, no network, standard library only: json, re, uuid, datetime; plus `import v2`, used ONLY as v2.add_log(S, kind, item_ids, payload, source)). Build datetimes only with datetime.combine(day_d, dtime(h, m)) or strptime; never datetime(...) with a date object as argument. ids: prefix + uuid4().hex[:10] ("plan_", "itm_", "msg_", "u_"). Messages you make have the full Message shape (id, role "agent", kind, text, item_id, at = S["now"], undo_id), are appended to S["messages"] and returned; run every text through a no-guilt check. Unknown plan ids raise KeyError.

    ITEM MATCHING: words of the text, lowercased, minus stop words (move, reschedule, push, shift, postpone, bump, delay,
    put, off, back, by, later, earlier, cancel, delete, remove, drop, scrap, skip, my, the, a, an, to, on, at, for, next,
    week, weeks, day, days, one, please, it). An open item matches when one of its title words (3+ letters) is in that set;
    best = most matching words, then earliest start. No match -> an info message "I couldn't find that one. Which item
    do you mean?" and no change.

    DAY WORDS (shared by QUERY, BULK, MOVE, TEXT import): today, tomorrow, weekday names and mon..sun (the soonest such
    date after today; "this saturday" the same), "October 23" / "Oct 23" / "2026-10-23", and a bare day of month
    "the 23rd" / "23rd" / "the 5th" / "on the 2nd" (this month; if that day is before today, next month). PART OF DAY
    narrows a day: morning 00:00-12:00, afternoon 12:00-17:00, evening / tonight 17:00-24:00.
    Hidden scenarios phrase these commands in OTHER words than the examples (other personas), so match the meaning
    with these broad trigger lists, never only the example sentences.

    handle_command(S, text) (lowercase, strip; try the rules IN THIS ORDER, return None unless one fires):
    - BULK (first): text has a clearing phrase (empty, clear, clear out, free up, wipe, nothing on, no plans,
      keep ... free, block out, cancel everything, cancel all, make room) AND a range (weekend, or a day word,
      optionally with a part of day). Range = the weekend = coming Saturday 00:00 to Monday 00:00 (if today is Saturday
      or Sunday, this weekend), or that one day 00:00-24:00, or only that part of that day ("friday evening" = Friday
      17:00-24:00, so a Friday 09:00 standup is NOT affected). affected = ids of open items whose [start, end) overlaps
      the range (no end -> start + 60 min; no start -> skip); items on other days are never affected.
      Plan ops: one delete op per affected item (before = copy of the item, after None) plus ALWAYS exactly ONE create
      op for the reason: purpose = the words after "for" if present, else the clause after the first comma (or after
      because / since / as); drop leading i have / i've got / i got / i'm / i am / we have / we're / there's / a / an /
      my / some / please; capitalise. "for a business trip" -> "Business trip", "I have a family reunion" -> "Family
      reunion", "I'm travelling to Lisbon" -> "Travelling to Lisbon", "I got concert tickets" -> "Concert tickets";
      no purpose -> "Time off". after = a full new Item, kind "event", that title, start/end: weekend Saturday 09:00 to
      Sunday 18:00, one day 09:00-18:00, part of day its range clipped to 23:59 (evening 18:00-23:00), window the range
      words ("weekend", "saturday", "friday evening"), source "typed". Plan {"id", "origin": "command", "status":
      "preview", "ops", "affected"} stored in S["plans"]. Nothing changes until apply. Response {"messages": [one info
      message naming how many items it would clear and the new one, ending "Shall I apply it?"], "created": [], "plan": plan}.
    - QUERY: text ends with "?" or starts with what / what's / whats / anything / any / show / when / do i have / is
      there / am i: find the day with DAY WORDS ("anything on the 23rd?" -> the 23rd of this month; none = today). Reply
      message kind "reply" naming EVERY item (any status) whose start date is that day, with its HH:MM or window,
      e.g. "On Thursday: Dentist at 15:00, Lunch with Ana around noon." (nothing there -> "Thursday looks free.").
      Changes nothing, creates nothing; add_log "query" (item_ids = those items, source "typed"). created [].
    - CANCEL: text starts with cancel / delete / remove / drop / scrap / skip / get rid of / forget / i don't need:
      best matching item -> a preview plan with one delete op (affected [id]) and an info message "I can remove 'Yoga'
      for you. Apply the change?"; response includes "plan"; the item stays until apply_plan.
    - MOVE: text starts with move / reschedule / push / shift / postpone / bump / delay / put off / pull: best matching
      item; the shift: "next week", "a week", "back a week", "by a week", "a week later", "one week" -> start and end
      +7 days; "N weeks" -> +7N days; "tomorrow", "a day", "back a day" -> +1 day; "N days" -> +N days; a weekday name ->
      that weekday, same time; a clock time -> same day at that time, same length. "push the eye exam back a week" moves
      Eye exam from 2026-10-23T14:00 to 2026-10-30T14:00. ONE item moved is applied at once (no plan): store
      S["undo"][undo_id] = its old start/end/window/postpone_count, update it, add_log "update" (item_ids [id], payload
      old and new start), info message "Moved 'Dentist' to Thu Oct 29 at 15:00." with that undo_id. Response
      {"messages", "created": []}.

    PLANS: apply_plan: only from status "preview" (else return it unchanged): delete op -> remove the item; create op
    -> append a copy of after; update op -> replace the item with after. status "applied"; add_log "plan_applied"
    (item_ids = affected + created ids, payload plan id), plus one add_log "delete" / "create" / "update" per op with its
    item id. undo_plan: only from "applied": put every before item back with all its original fields (deleted ones
    re-inserted), remove created ones; status "undone"; add_log "plan_undone".

    import_file(S, filename, content): ICS when content contains BEGIN:VCALENDAR or filename ends .ics, else TEXT.
    - ICS: normalise \r\n, unfold lines starting with a space, read each BEGIN:VEVENT..END:VEVENT. Property name =
      text before the first ";" or ":", value = text after the first ":". DTSTART/DTEND value "YYYYMMDD" (VALUE=DATE)
      -> all-day: start "YYYY-MM-DDT00:00", end = DTEND date at 00:00 (or next day), window "all day"; value
      "YYYYMMDDTHHMMSS" with or without TZID or a trailing Z -> keep the wall-clock digits exactly (20261022T091500 ->
      "2026-10-22T09:15"; never convert zones, never round). Item kind "event", title SUMMARY, source "ics", "uid" = UID,
      "recurrence" = the RRULE value or None, every other Item key default. One create op per VEVENT, EXCEPT skip a
      VEVENT whose UID equals the uid of an existing item or whose title (case-insensitive) and start equal an
      existing item's: re-importing the same file gives a plan with 0 creates.
    - TEXT: split into sentences on . ! ? and newlines. A sentence with away / clear / free / cancel / off plus weekend
      or a day word -> delete ops for open items overlapping that range (same range rule as BULK). Any other sentence
      with a day word, clock time or soft window ("around noon" 12:00-13:00, morning 09:00-12:00, afternoon 14:00-17:00,
      evening 18:00-21:00) -> one create op: title = the sentence minus also/on/at, day and time words, capitalised
      ("Lunch with Ana"), start on that day, window kept, kind "event" if it has with/lunch/dinner/meet/call else
      "task", source "text". So "I'll be away this weekend, please clear it. Also lunch with Ana on Wednesday around
      noon." gives deletes for the weekend items plus a create "Lunch with Ana" on Wednesday 12:00, window "around noon".
    - Both: plan origin "import", status "preview", stored; add_log "import" (item_ids = affected ids, payload
      filename and op count, source "ics" or "text"). Return {"plan"}.

    Define handle_command, import_file, apply_plan, undo_plan at module level plus your helpers. Check silently that every called name is defined.
    Output exactly one artifact: <artifact name="commands_py">...whole file...</artifact> and nothing else.
  expects:
  - commands_py
