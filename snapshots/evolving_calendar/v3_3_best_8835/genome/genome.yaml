    no placeholder text such as "[Week view]" or "(placeholder)" remains, the page fits one screen (body
    100vh grid, every panel scrolls inside itself) and #chat-log is drawn only from state.messages.
    Output exactly one artifact: <artifact name="index_html">...whole file...</artifact> and nothing else.
  expects:
  - index_html
  soul: false
- name: smoke
  kind: check
  check: app_smoke
  calls: v3
  render: true
- name: fixer
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  reads:
  - contract
  - blackboard.smoke
  - artifacts_named_by.smoke
  max_tokens: 32000
  prompt: |-
    The team's app (app.py + convo.py + v2.py + commands.py + v3.py + index.html) was just started by the smoke check. Its report:
    {blackboard.smoke}

    If the report starts with "SMOKE: PASS", output only the word NO_CHANGE. Otherwise find the ROOT cause of every compile error, traceback, selftest failure, HTTP 500 or wrong JSON shape (read the last frames of the traceback and the named file and line), fix it in the source, and check the same mistake is not repeated elsewhere (every datetime(...) call, every v2.<name> / v3.<name> call against the V2 / V3 INTERFACE lists, every name used but never defined). A missing or empty file must be written in full from the spec in your system message and the contract. Keep all behaviour that already works; do not rename functions, endpoints or V2 INTERFACE names.
    Code map: bulk / query / move / cancel commands, plans and imports live in commands.py; log, beliefs, proposals, views, knobs and prompts in v2.py; catalog, critic and design in v3.py; parsing, complexity, done/undo, focus and HTTP in app.py; chat, breakdowns, appetite and clock in convo.py. Never re-emit a file unchanged.
        Re-emit ONLY the files that need a change (usually one), each whole, as <artifact name="...">...</artifact> with the existing names (app_py, convo_py, v2_py, commands_py, v3_py, index_html). Do not re-emit a file the report does not implicate.
        "app did not start" with "selftest: exit 0" and no traceback means slow start-up or a slow /api/clock (FAST CLOCK AND STARTUP in your system message): rewrite the clock loop to visit only due moments and make sure main() serves before anything slow. If a previous fix of yours did not change the report, change your approach; re-emitting the same file again is wasted.
- name: auditor
  kind: llm
  model: crusoe:openai/gpt-oss-120b
  soul: false
  reads:
  - contract.required-behaviour
  - contract.v2-additions--required-behaviour-v2
  - contract.v3-additions--required-behaviour-v3
  - artifact.app_py
  - artifact.convo_py
  - artifact.v2_py
  - artifact.commands_py
  - artifact.v3_py
  max_tokens: 8000
  prompt: |-
    You audit the team's app file by file against the contract's numbered behaviours; you do not write code.
    The app's files are below (app.py: server, parsing, complexity detection, done/undo, focus, routes; convo.py: chat,
    breakdowns, appetite, clock, reminders, postpone, check-in; v2.py: log, beliefs, proposals, views, knobs, prompts;
    commands.py: query/move/cancel/bulk commands, plans, imports; the page index.html is reviewed by someone else).

    Trace these concrete cases through the code and report only real defects you can point at:
    - "dentist thursday 3pm" at now 2026-10-19T09:00 -> event 2026-10-22T15:00; "lunch with Ana around noon tomorrow" ->
      window kept, start 2026-10-20T12:00; dump "call mom, portfolio, maybe yoga?, dentist thursday 3pm" -> 4 items, <= 1
      question; "sort out my closet" -> exactly one question; "call mom" -> none.
    - breakdown chat "sure, go ahead" -> why question -> 2 more questions -> breakdown (first step <= 15 min) -> "that works
      for me" -> child tasks before the deadline, goal why set; focus returns step 1 with parent and why.
    - reminders at start and at end - 10 min, once; a task ended 14:00-15:00 postponed after 15:31 to the next day at the
      usual hour with an undo_id message naming it; undo restores every field; the third postponement sends one checkin.
    - "free up my saturday, I have a family reunion" -> preview plan deleting exactly the Saturday items + one create;
      "push the eye exam back a week" -> +7 days; "anything on the 23rd?" -> reply naming both items; .ics TZID times kept
      as wall clock, re-import gives 0 creates.
    - learner: 8 of 9 done after 20:00 -> evening belief >= 0.7 citing 8; deleted belief not re-learned; gate uses
      meta.threshold; 3 dismisses raise it; 3 declined offers lower breakdown_appetite and stop the question.
    - every cross-file call matches the CONVO / V2 / V3 / COMMANDS interfaces (names and arguments).

    If nothing is wrong, answer with the single line ALL_CLEAR. Otherwise one line per defect, each starting with the file
    name: "convo.py: <function>: <what is wrong> -> <what it must do>".
- name: fix_app
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  soul: true
  reads:
  - blackboard.auditor
  - artifact.app_py
  max_tokens: 32000
  prompt: |-
    You own app.py of the team's app. The auditor's report:
    {blackboard.auditor}

    Current app.py:
    {artifact.app_py}

    If no line of the report starts with "app.py:", output only NO_CHANGE. Otherwise fix exactly the defects on the lines that start with "app.py:" (other files have their own owners; keep every interface name, route, id and working part unchanged) and re-emit the whole file as <artifact name="app_py">...</artifact>.
- name: fix_convo
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  soul: true
  reads:
  - blackboard.auditor
  - artifact.convo_py
  max_tokens: 32000
  prompt: |-
    You own convo.py of the team's app. The auditor's report:
    {blackboard.auditor}

    Current convo.py:
    {artifact.convo_py}

    If no line of the report starts with "convo.py:", output only NO_CHANGE. Otherwise fix exactly the defects on the lines that start with "convo.py:" (other files have their own owners; keep every interface name, route, id and working part unchanged) and re-emit the whole file as <artifact name="convo_py">...</artifact>.
- name: fix_v2
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  soul: true
  reads:
  - blackboard.auditor
  - artifact.v2_py
  max_tokens: 32000
  prompt: |-
    You own v2.py of the team's app. The auditor's report:
    {blackboard.auditor}

    Current v2.py:
    {artifact.v2_py}

    If no line of the report starts with "v2.py:", output only NO_CHANGE. Otherwise fix exactly the defects on the lines that start with "v2.py:" (other files have their own owners; keep every interface name, route, id and working part unchanged) and re-emit the whole file as <artifact name="v2_py">...</artifact>.
- name: fix_commands
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  soul: true
  reads:
  - blackboard.auditor
  - artifact.commands_py
  max_tokens: 32000
  prompt: |-
    You own commands.py of the team's app. The auditor's report:
    {blackboard.auditor}

    Current commands.py:
    {artifact.commands_py}

    If no line of the report starts with "commands.py:", output only NO_CHANGE. Otherwise fix exactly the defects on the lines that start with "commands.py:" (other files have their own owners; keep every interface name, route, id and working part unchanged) and re-emit the whole file as <artifact name="commands_py">...</artifact>.
- name: fix_ui
  kind: llm
  model: crusoe:deepseek-ai/DeepSeek-V4.1-Flash#nothink
  soul: false
  reads:
  - blackboard.ui_review
  - spec.ui_layout
  - artifact.index_html
  max_tokens: 32000
  prompt: |-
    You own index.html of the team's app. The page reviewer's report:
    {blackboard.ui_review}

    Current index.html:
    {artifact.index_html}

    If no line of the report starts with "index.html:", output only NO_CHANGE. Otherwise fix exactly the defects on the lines that start with "index.html:" (other files have their own owners; keep every interface name, route, id and working part unchanged; keep the one-screen layout: body is a 100vh
    grid, the chat composer, #focus, the calendar, #timeline, #learned and #activity all stay on screen and scroll
    inside themselves) and re-emit the whole file as <artifact name="index_html">...</artifact>.
- name: ui_review
  kind: llm
  model: crusoe:openai/gpt-oss-120b
  soul: false
  reads:
  - contract.v3-2-addition-how-the-page-should-look-and-feel
  - spec.ui_layout
  - blackboard.smoke
  - artifact.index_html
  max_tokens: 6000
  prompt: |-
    You review the page index.html of a calm planning app for a person who finds planning hard; you do not write
    code. A screenshot judge scores the VIEWPORT (about 1400 x 900, no scrolling) after a seeded session. The
    last smoke report (it rendered the page in headless Chrome and lists missing ids and the visible text):
    {blackboard.smoke}

    Check index.html against the look-and-feel section and the ONE-SCREEN APP SHELL spec, and report only real
    defects you can point at, most visible first, at most 8: anything that makes the page taller than the
    screen (body not a 100vh grid, a panel without min-height 0 / its own overflow), the composer, #learned or
    #activity not on screen, placeholder or raw ISO text in the visible text, duplicated chat bubbles (a local
    copy of the person text), more than one hidden-count line, week blocks that break words, red colours,
    missing quick-reply chips or Undo chips, a missing "Start 5 minutes" in the static #focus markup, a proposal
    card that is a modal, any display:none other than #proposal.
    If nothing is wrong, answer with the single line ALL_CLEAR. Otherwise one line per defect, each starting with
    "index.html:" then the element or function, what is wrong -> what it must do.
workflow:
- parallel:
  - core
  - convo
  - v2
  - commands
  - v3
  - ui
- smoke
- loop:
    body:
    - fixer
    - smoke
    max_rounds: 2
    stop_when: 'SMOKE: PASS'
    check_first: true
- loop:
    body:
    - auditor
    - parallel:
      - fix_app
      - fix_convo
      - fix_v2
      - fix_commands
    - smoke
    max_rounds: 1
    stop_on: auditor
    stop_when: ALL_CLEAR
- loop:
    body:
    - ui_review
    - fix_ui
    - smoke
    max_rounds: 1
    stop_on: ui_review
    stop_when: ALL_CLEAR
- loop:
    body:
    - fixer
    - smoke
    max_rounds: 1
    stop_when: 'SMOKE: PASS'
    check_first: true
artifacts:
- name: app_py
  format: text
- name: convo_py
  format: text
- name: v2_py
  format: text
- name: commands_py
  format: text
- name: v3_py
  format: text
- name: index_html
  format: text
outputs:
  answer: artifact.app_py
