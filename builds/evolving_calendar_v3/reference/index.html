<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolving Calendar</title>
<style>
:root{--bg:#f6f4ef;--card:#fffdf9;--ink:#2f3a3a;--soft:#6c7a78;--line:#e4dfd5;--accent:#5f8f86;--accent2:#d9e9e4;
--warm:#f1e6d6;--event:#c9d9ec;--agent:#eef4f1;--me:#f3ece1}
@media (prefers-color-scheme: dark){:root{--bg:#1d2222;--card:#252b2b;--ink:#e3e7e4;--soft:#9aa7a4;--line:#36403f;
--accent:#86b8ad;--accent2:#2f4440;--warm:#3d362c;--event:#2e3d50;--agent:#28332f;--me:#3a342b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;font-weight:600;margin:0 auto 0 0;letter-spacing:.2px}
.clock{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
padding:5px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;padding:18px 20px;max-width:1240px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:1fr;padding:14px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--soft);margin:0 0 10px;font-weight:600}
#chat-log{height:56vh;min-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.agent{background:var(--agent);align-self:flex-start;border-bottom-left-radius:4px}
.msg.person{background:var(--me);align-self:flex-end;border-bottom-right-radius:4px}
.msg .meta{display:block;font-size:11px;color:var(--soft);margin-bottom:2px}
.msg ol{margin:6px 0 2px 18px;padding:0}
.msg .acts{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.msg .acts button{padding:3px 11px;font-size:13px}
.composer{display:flex;gap:8px;margin-top:12px;align-items:center}
#chat-input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 15px;font:inherit;background:var(--bg);color:var(--ink);min-width:0}
#chat-input:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
.modes{display:flex;gap:6px;margin-top:8px;font-size:13px;color:var(--soft);align-items:center;flex-wrap:wrap}
.modes label{cursor:pointer}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--accent2);border-radius:999px;padding:2px 10px;font-size:12px}
.chip button{border:none;background:none;padding:0 2px;color:var(--soft)}
#focus .step{font-size:20px;font-weight:600;margin:4px 0}
#focus .why{color:var(--accent);font-style:italic;margin:6px 0 12px}
#focus .sub{color:var(--soft);font-size:13px}
#focus .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-size:22px;color:var(--accent)}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
#timeline{display:grid;grid-template-columns:42px 1fr 1fr;gap:0 8px;font-size:12px}
.daycol{position:relative;border-left:1px solid var(--line);height:520px}
.dayhead{font-weight:600;color:var(--soft);padding:0 0 6px 6px}
.hours{position:relative;height:520px}
.hours span{position:absolute;right:4px;color:var(--soft);font-size:11px;transform:translateY(-50%)}
.hline{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.blk{position:absolute;left:6px;right:4px;border-radius:9px;padding:3px 7px;overflow:hidden;background:var(--warm);
border:1px solid transparent;line-height:1.25;min-height:18px}
.blk.event{background:var(--event)}
.blk.soft{background:transparent;border:1.5px dashed var(--accent);opacity:.9}
.blk.step{background:var(--accent2)}
.blk.done{opacity:.45;text-decoration:line-through}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--accent);z-index:2}
.loose{margin-top:10px;font-size:13px;color:var(--soft)}
.loose span{display:inline-block;margin:3px 6px 0 0;padding:2px 9px;border:1.5px dashed var(--line);border-radius:999px;color:var(--ink)}
.busy{opacity:.6;pointer-events:none}
#view-switcher{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
#view-switcher button{font-size:12px;padding:3px 10px}
#view-switcher button.on{background:var(--accent2);border-color:var(--accent)}
.hiddennote{font-size:12px;color:var(--soft);margin-top:6px}
#proposal{border-color:var(--accent)}
#proposal .reason{color:var(--soft);font-size:13px;margin:4px 0 10px}
#learned ul,#activity ul{list-style:none;margin:0;padding:0}
#learned li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
#learned li:first-child{border-top:none}
#learned li .c{color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
#learned li button{border:none;background:none;color:var(--soft);padding:0 4px;margin-left:auto}
#activity li{font-size:12px;padding:4px 0;border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
#activity li b{color:var(--accent);font-weight:600}
#activity{max-height:260px;overflow-y:auto}
.importbox{margin-top:10px;font-size:13px}
.importbox textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:6px 10px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px}
.month .mcell{min-height:54px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;overflow:hidden}
#timeline{display:block}
.cols{display:flex;gap:6px;overflow-x:auto}
.cols .ruler{flex:0 0 34px}
.cols .dcol{flex:1 1 0;min-width:70px}
.dcol .daycol{height:auto}
.hours{position:relative}
.chipitem{font-size:11px;background:var(--warm);border-radius:6px;padding:1px 5px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chipitem.event{background:var(--event)}
.chipitem.row{font-size:13px;padding:4px 8px;margin:4px 0;white-space:normal}
.chipitem.done{opacity:.5;text-decoration:line-through}
.w{color:var(--soft);font-size:12px}
.mcell.other{opacity:.45}
.agenda .aday{padding:6px 0;border-top:1px solid var(--line)}
.lane{border-left:3px solid var(--accent2);padding:2px 0 6px 10px;margin:6px 0}
.lanelabel{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px}
.bucket{border:1.5px dashed var(--line);border-radius:12px;padding:6px 10px;margin:8px 0}
#timeline [data-day],#timeline [data-item]{will-change:transform}
@media (prefers-reduced-motion: reduce){#timeline *,#timeline{animation:none!important;transition:none!important}}

.month .today{border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Evolving Calendar</h1>
  <span class="clock" id="clock">…</span>
  <button onclick="scrub(30)">+30 min</button>
  <button onclick="scrub(60)">+1 h</button>
  <button onclick="nextMorning()">Next morning</button>
  <button class="primary" onclick="seedIris()">Start as Iris</button>
</header>
<main>
  <section class="card">
    <h2>Talk to me</h2>
    <div id="chat-log" aria-live="polite"></div>
    <div class="composer">
      <input id="chat-input" placeholder="Empty your head here: call mom, portfolio, maybe yoga?…" autocomplete="off">
      <button class="primary" id="send" onclick="send()">Send</button>
    </div>
    <div class="modes">
      <label><input type="radio" name="mode" value="dump" checked> brain dump</label>
      <label><input type="radio" name="mode" value="command"> one thing</label>
      <span id="ctx"></span>
    </div>
    <details class="importbox"><summary>Import a calendar (.ics) or a note</summary>
      <input type="file" id="import-file" accept=".ics,.txt,text/plain,text/calendar">
      <textarea id="import-text" placeholder="…or paste a note: I'll be away this weekend, please clear it."></textarea>
      <button onclick="doImport()">Preview changes</button>
    </details>
  </section>
  <div class="side">
    <section class="card" id="focus"><h2>Right now</h2><div class="sub">Nothing to do right now. Breathe.</div></section>
    <section class="card" id="proposal" hidden></section>
    <section class="card">
      <h2>Your calendar</h2>
      <div id="view-switcher">
        <button data-v="month" onclick="switchView('month')">month</button>
        <button data-v="week" onclick="switchView('week')">week</button>
        <button data-v="workweek" onclick="switchView('workweek')">workweek</button>
        <button data-v="day" onclick="switchView('day')">day</button>
      </div>
      <div id="timeline"></div>
      <div class="hiddennote" id="hidden-note"></div>
      <div class="loose" id="loose"></div>
    </section>
    <section class="card" id="learned"><h2>What I've learned</h2><div class="sub">Nothing yet.</div></section>
    <section class="card"><h2>What the agents did</h2><div id="activity"></div></section>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
let S = {now: null, items: [], messages: []};
let active = null;          // item the conversation is about
let timerEnd = null, timerH = null;

async function api(path, body) {
  const opt = body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  return r.json();
}
function esc(s){return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function parse(iso){ if(!iso) return null; const [d,t='00:00'] = iso.split('T'); const [y,m,dd] = d.split('-').map(Number); const [h,mi] = t.split(':').map(Number); return new Date(y, m-1, dd, h, mi); }
function fmt(d){ return d.toLocaleString([], {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); }
function isoOf(d){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

async function refresh() {
  S = await api('/api/state');
  const f = await api('/api/focus');
  render(f);
  const [b, p, a] = await Promise.all([api('/api/beliefs'), api('/api/proposal'), api('/api/activity')]);
  renderLearned(b.beliefs); renderProposal(p.proposal); renderActivity(a.events);
}

function render(f) {
  $('#clock').textContent = S.now ? fmt(parse(S.now)) : '';
  // chat
  const log = $('#chat-log');
  log.innerHTML = S.messages.map(m => {
    const it = S.items.find(i => i.id === m.item_id);
    let html = `<div class="msg ${m.role}" data-id="${m.id}">`;
    if (m.role === 'agent' && m.kind !== 'reply') html += `<span class="meta">${esc(m.kind)}</span>`;
    if (m.kind === 'breakdown') {
      const first = esc(m.text.split('\n')[0]);
      html += first + '<ol>' + m.steps.map(s => `<li>${esc(s.title)} <span class="meta" style="display:inline">${s.estimate_min} min</span></li>`).join('') + '</ol>';
      html += esc(m.text.split('\n').slice(-1)[0]);
      html += `<div class="acts"><button onclick="reply('${m.item_id}','Looks good')">Looks good</button><button onclick="hint('${m.item_id}','Make the steps smaller')">Change something</button></div>`;
    } else {
      html += esc(m.text);
    }
    if (m.plan_id) { const st = planStatus[m.plan_id] || 'preview';
      html += `<div class="acts">${st === 'preview' ? `<button onclick="planAct('${m.plan_id}','apply')">Apply</button>` : ''}${st === 'applied' ? `<button onclick="planAct('${m.plan_id}','undo')">Undo all</button>` : ''}<span class="meta" style="display:inline">${st}</span></div>`; }
    if (m.undo_id) html += `<div class="acts"><button onclick="undo('${m.undo_id}')">Undo</button></div>`;
    if (m.kind === 'checkin') html += `<div class="acts"><button onclick="reply('${m.item_id}','It feels too big')">Too big</button><button onclick="reply('${m.item_id}','Wrong time')">Wrong time</button><button onclick="reply('${m.item_id}','Not needed anymore')">Not needed</button></div>`;
    if (m.kind === 'question' && /break it into/.test(m.text)) html += `<div class="acts"><button onclick="reply('${m.item_id}','Yes please')">Yes please</button><button onclick="reply('${m.item_id}','No, it is fine')">Not now</button></div>`;
    return html + '</div>';
  }).join('');
  log.scrollTop = log.scrollHeight;
  // active conversation: latest agent message that asks something about an item
  active = null;
  for (let i = S.messages.length - 1; i >= 0; i--) {
    const m = S.messages[i];
    if (m.role === 'person' && !m.item_id) break;
    if (m.role === 'agent' && m.item_id && ['question','breakdown','checkin'].includes(m.kind)) { active = m.item_id; break; }
    if (m.role === 'agent' && ['reply','info'].includes(m.kind) && m.item_id) break;
  }
  const ai = S.items.find(i => i.id === active);
  $('#ctx').innerHTML = ai ? `<span class="chip">replying about “${esc(ai.title)}” <button title="new topic" onclick="active=null;this.parentNode.remove()">×</button></span>` : '';
  renderFocus(f);
  renderTimeline();
}

function renderFocus(f) {
  const el = $('#focus');
  if (!f || !f.item) { el.innerHTML = '<h2>Right now</h2><div class="sub">Nothing to do right now. Breathe.</div>'; return; }
  const it = f.item;
  el.innerHTML = `<h2>Right now, just this</h2>
    ${f.parent ? `<div class="sub">a tiny step toward “${esc(f.parent.title)}”</div>` : ''}
    <div class="step">${esc(it.title)}</div>
    ${f.why ? `<div class="why">because: ${esc(f.why)}</div>` : '<div style="height:10px"></div>'}
    <div class="row"><button class="primary" id="start5">${esc(f.action || 'Start 5 minutes')}</button>
    <span class="timer" id="timer"></span>
    <button onclick="markDone('${it.id}')">I did it</button>
    ${it.estimate_min ? `<span class="sub">about ${it.estimate_min} min</span>` : ''}</div>`;
  $('#start5').onclick = startTimer;
  tick();
}
function startTimer(){ timerEnd = Date.now() + 5*60*1000; clearInterval(timerH); timerH = setInterval(tick, 1000); tick(); }
function tick(){ const t = $('#timer'); if (!t || !timerEnd) return; const s = Math.max(0, Math.round((timerEnd - Date.now())/1000));
  t.textContent = s ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : 'five minutes, done. Keep going only if you like.'; if (!s) { clearInterval(timerH); timerEnd = null; } }

// ---------- views: every view is rendered from a catalog spec (built-in views map to one) ----------
const PXH = 26;   // pixels per hour in timelines
function ymd(d){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function dayOf(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(d, k){ const x = new Date(d); x.setDate(x.getDate() + k); return x; }
function itemEnd(it){ const s = parse(it.start); return it.end && parse(it.end) > s ? parse(it.end) : new Date(s.getTime() + (it.estimate_min || 30) * 60000); }
function onDay(it, d){ if (!it.start) return false; const s = parse(it.start), e = new Date(itemEnd(it).getTime() - 60000); const a = new Date(d); a.setHours(0,0,0,0); const b = addDays(a, 1); return s < b && (e >= a || s >= a); }
function normFilter(f){
  if (!f) return {}; if (typeof f === 'object') return f;
  const s = String(f).toLowerCase().trim(), m = s.match(/^(\w+)\s*[=:]\s*(.+)$/);
  if (m) return {[m[1]]: /^\d+$/.test(m[2]) ? +m[2] : m[2]};
  if (/^(evening|evenings|night)$/.test(s)) return {hour_from: 17, hour_to: 24};
  if (/^mornings?$/.test(s)) return {hour_from: 5, hour_to: 12};
  return {window: s};
}
function matchF(f, it){
  f = normFilter(f);
  if (f.kind && it.kind !== f.kind) return false;
  if (f.category && (it.category || it.kind) !== f.category) return false;
  if (f.window && !(it.window || '').toLowerCase().includes(String(f.window).toLowerCase())) return false;
  if ('hour_from' in f || 'hour_to' in f) { if (!it.start) return false; const s = parse(it.start), h = s.getHours() + s.getMinutes()/60;
    if (h < (f.hour_from ?? 0) || h >= (f.hour_to ?? 24)) return false; }
  return true;
}
function builtinSpec(v, now){
  const t = v.type, p = v.params || {}, today = new Date(now); today.setHours(0,0,0,0);
  const mon = addDays(today, -((today.getDay() + 6) % 7));
  const one = el => ({root: 'r', elements: {r: el}});
  if (t === 'custom' && v.spec && v.spec.elements) return v.spec;
  if (t === 'month') return one({type: 'MonthGrid', props: {month: ymd(today).slice(0, 7)}, children: []});
  if (t === 'day') return one({type: 'DayTimeline', props: {date: ymd(today), from_hour: p.start_hour ?? 7, to_hour: p.end_hour ?? 24}, children: []});
  if (t === 'workweek' || p.hide_weekends) return one({type: 'WeekColumns', props: {start: ymd(mon), days: 5}, children: []});
  return one({type: 'WeekColumns', props: {start: ymd(mon), days: 7}, children: []});
}
function chip(it, cls=''){ return `<div class="chipitem ${it.kind} ${it.status === 'done' ? 'done' : ''} ${cls}" data-item="${esc(it.id)}" title="${esc(it.title)}">${esc(it.title)}${it.window ? ` <span class="w">· ${esc(it.window)}</span>` : ''}</div>`; }
function dayColumn(d, fromH, toH, pred, ctx, now){
  const H = (toH - fromH) * PXH, isToday = ymd(d) === ymd(now);
  let c = `<div class="dcol" data-day="${ymd(d)}"><div class="dayhead">${isToday ? 'Today' : d.toLocaleDateString([], {weekday:'short'})} ${d.getDate()}</div><div class="daycol" style="height:${H}px">`;
  for (let h = fromH; h < toH; h += 2) c += `<div class="hline" style="top:${(h-fromH)*PXH}px"></div>`;
  for (const it of S.items) {
    if (!it.start || it.kind === 'note' || !onDay(it, d) || !pred(it)) continue;
    const s = parse(it.start), e = itemEnd(it);
    const sh = s.toDateString() === d.toDateString() ? s.getHours() + s.getMinutes()/60 : 0;
    const eh = e.toDateString() === d.toDateString() ? e.getHours() + e.getMinutes()/60 : 24;
    if (eh <= fromH || sh >= toH) continue;
    ctx.shown.add(it.id);
    const top = (Math.max(sh, fromH) - fromH) * PXH, ht = Math.max(18, (Math.min(eh, toH) - Math.max(sh, fromH)) * PXH - 2);
    const cls = ['blk', it.kind, it.window ? 'soft' : '', it.parent_id ? 'step' : '', it.status === 'done' ? 'done' : ''].join(' ');
    c += `<div class="${cls}" data-item="${esc(it.id)}" style="top:${top}px;height:${ht}px" title="${esc(it.title)}">${esc(it.title)}${it.window ? ` <span class="w">· ${esc(it.window)}</span>` : ''}</div>`;
  }
  if (isToday) { const nh = now.getHours() + now.getMinutes()/60; if (nh >= fromH && nh <= toH) c += `<div class="nowline" style="top:${(nh-fromH)*PXH}px"></div>`; }
  return c + '</div></div>';
}
function ruler(fromH, toH){ let r = `<div class="ruler"><div class="dayhead">&nbsp;</div><div class="hours" style="height:${(toH-fromH)*PXH}px">`;
  for (let h = fromH; h <= toH; h += 2) r += `<span style="top:${(h-fromH)*PXH}px">${h % 12 || 12}${h < 12 || h === 24 ? 'a' : 'p'}</span>`; return r + '</div></div>'; }
const RENDER = {
  WeekColumns(p, pred, ctx, now){ const a = p.start ? dayOf(p.start) : now, n = Math.max(1, Math.min(14, +p.days || 7));
    return `<div class="cols">${ruler(7, 24)}${[...Array(n).keys()].map(k => dayColumn(addDays(a, k), 7, 24, pred, ctx, now)).join('')}</div>`; },
  DayTimeline(p, pred, ctx, now){ const f = Math.max(0, +(p.from_hour ?? 7)), t = Math.min(24, +(p.to_hour ?? 24));
    return `<div class="cols">${ruler(f, t)}${dayColumn(p.date ? dayOf(p.date) : now, f, t, pred, ctx, now)}</div>`; },
  MonthGrid(p, pred, ctx, now){ const m = (p.month || ymd(now)).slice(0, 7), first = dayOf(m + '-01'), start = addDays(first, -((first.getDay() + 6) % 7));
    let h = '<div class="month">';
    for (let k = 0; k < 42; k++) { const d = addDays(start, k), its = S.items.filter(i => i.kind !== 'note' && onDay(i, d) && pred(i));
      its.forEach(i => ctx.shown.add(i.id));
      h += `<div class="mcell ${ymd(d) === ymd(now) ? 'today' : ''} ${d.getMonth() !== first.getMonth() ? 'other' : ''}" data-day="${ymd(d)}"><b>${d.getDate()}</b>${its.map(i => chip(i)).join('')}</div>`; }
    return h + '</div>'; },
  AgendaList(p, pred, ctx, now){ const a = p.from ? dayOf(p.from) : now, b = p.to ? dayOf(p.to) : addDays(a, 6); let h = '<div class="agenda">';
    for (let d = new Date(a); d <= b; d = addDays(d, 1)) { const its = S.items.filter(i => i.kind !== 'note' && onDay(i, d) && pred(i)).sort((x, y) => x.start < y.start ? -1 : 1);
      its.forEach(i => ctx.shown.add(i.id));
      h += `<div class="aday" data-day="${ymd(d)}"><div class="dayhead">${d.toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'})}</div>${its.length ? its.map(i => chip(i, 'row')).join('') : '<div class="w">open</div>'}</div>`; }
    return h + '</div>'; },
  Lane(p, pred, ctx, now, el, spec){ const f = p.filter, inner = i => pred(i) && matchF(f, i);
    const kids = (el.children || []).filter(c => spec.elements[c]);
    const body = kids.length ? kids.map(c => renderEl(spec, c, inner, ctx, now)).join('')
      : `<div class="bucketlist">${S.items.filter(inner).map(i => (ctx.shown.add(i.id), chip(i, 'row'))).join('')}</div>`;
    return `<section class="lane"><div class="lanelabel">${esc(p.label || '')}</div>${body}</section>`; },
  Bucket(p, pred, ctx, now, el, spec, id){ ctx.buckets.push({id, filter: p.filter, pred}); return `<section class="bucket"><div class="lanelabel">${esc(p.label || 'Everything else')}</div><div class="bucketlist" data-bucket="${esc(id)}"></div></section>`; },
};
function renderEl(spec, id, pred, ctx, now){
  const el = spec.elements[id]; if (!el || ctx.seen.has(id)) return ''; ctx.seen.add(id);
  const fn = RENDER[el.type]; if (!fn) return `<div class="w">(unknown block ${esc(el.type)})</div>`;
  return fn(el.props || {}, pred, ctx, now, el, spec, id);
}
let lastViewKey = null;
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function renderTimeline() {
  const el = $('#timeline'); if (!S.now) { el.innerHTML = ''; return; }
  const v = S.view || {type: 'week', params: {}};
  document.querySelectorAll('#view-switcher button').forEach(b => b.classList.toggle('on', b.dataset.v === v.type));
  const hc = v.hidden_counts || {}, hk = Object.keys(hc);
  $('#hidden-note').textContent = hk.length ? 'Not shown in this view: ' + hk.sort().map(k => `${hc[k]} on ${dayOf(k).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})}`).join(', ') : '';
  const now = parse(S.now), spec = builtinSpec(v, now);
  const ctx = {shown: new Set(), buckets: [], seen: new Set()};
  let html = renderEl(spec, spec.root, () => true, ctx, now);
  const key = JSON.stringify([v.type, v.params, v.spec]);
  const animate = lastViewKey !== null && key !== lastViewKey;
  lastViewKey = key;
  const before = animate ? snapshotRects(el) : null;
  el.innerHTML = html;
  for (const b of ctx.buckets) {
    const its = S.items.filter(i => !ctx.shown.has(i.id) && b.pred(i) && matchF(b.filter, i));
    const box = el.querySelector(`[data-bucket="${CSS.escape(b.id)}"]`);
    if (box) box.innerHTML = !its.length ? '<div class="w">nothing else</div>' : its.slice(0, 6).map(i => chip(i, 'row')).join('')
      + (its.length > 6 ? `<details><summary class="w">+${its.length - 6} more</summary>${its.slice(6).map(i => chip(i, 'row')).join('')}</details>` : '');
    its.forEach(i => ctx.shown.add(i.id));
  }
  if (animate) morph(el, before);
  const loose = S.items.filter(i => i.status === 'open' && !ctx.shown.has(i.id));
  $('#loose').innerHTML = loose.length ? 'Soft, no fixed time: ' + loose.map(i => `<span data-item="${esc(i.id)}">${esc(i.title)}${i.window ? ' · ' + esc(i.window) : ''}${i.why ? ' ✦' : ''}</span>`).join('') : '';
}
// FLIP morph: the same day / item element glides from its old box to its new one (<= 450 ms)
function snapshotRects(root){ const m = new Map();
  root.querySelectorAll('[data-day],[data-item]').forEach(n => { const k = n.dataset.day ? 'd:' + n.dataset.day : 'i:' + n.dataset.item; if (!m.has(k)) m.set(k, n.getBoundingClientRect()); });
  return m; }
function morph(root, before){
  if (!root.animate) return;
  if (reduceMotion()) { root.animate([{opacity: 0.4}, {opacity: 1}], {duration: 200, easing: 'linear'}); return; }
  const used = new Set();
  root.querySelectorAll('[data-day],[data-item]').forEach(n => {
    const k = n.dataset.day ? 'd:' + n.dataset.day : 'i:' + n.dataset.item, old = before.get(k);
    if (used.has(k)) return; used.add(k);
    const now = n.getBoundingClientRect();
    if (!old || !now.width || !now.height) { n.animate([{opacity: 0}, {opacity: 1}], {duration: 450, easing: 'ease-out'}); return; }
    const dx = old.left - now.left, dy = old.top - now.top, sx = old.width / now.width, sy = old.height / now.height;
    n.animate([{transformOrigin: 'top left', transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`},
               {transformOrigin: 'top left', transform: 'none'}], {duration: 450, easing: 'cubic-bezier(.2,.7,.2,1)'});
  });
}
function renderLearned(bs) {
  const m = S.meta || {};
  const items = (bs || []).map(b => `<li><span>${esc(b.statement)}<br><span class="c">${b.level === 'meta' ? 'about how I help' : 'habit'} · confidence ${Math.round(b.confidence*100)}%</span></span><button title="Forget this" onclick="forget('${esc(b.key)}')">✕</button></li>`).join('');
  $('#learned').innerHTML = `<h2>What I've learned</h2>${items ? `<ul>${items}</ul>` : '<div class="sub">Nothing yet. I learn from what you actually do.</div>'}
    <div class="sub" style="margin-top:8px">Style: ${m.novelty < 0.5 ? 'classic views first' : 'open to new layouts'} · tone ${esc(m.tone || 'gentle')} · ideas at most every ${m.cadence_hours ?? '?'} h</div>`;
}
let lastAccepted = null;
function renderProposal(p) {
  const el = $('#proposal');
  if (p) { el.hidden = false; el.innerHTML = `<h2>An idea</h2><div class="step" style="font-weight:600">${esc(p.title)}</div><div class="reason">${esc(p.reason)}</div>
    <div class="row" style="display:flex;gap:8px"><button class="primary" onclick="propAct('${p.id}','accept')">Try it</button><button onclick="propAct('${p.id}','dismiss')">Not now</button></div>`; return; }
  if (lastAccepted) { el.hidden = false; el.innerHTML = `<h2>Trying: ${esc(lastAccepted.title)}</h2><div class="reason">Not feeling it? One tap brings the old view back.</div><button onclick="propAct('${lastAccepted.id}','undo')">Undo</button>`; return; }
  el.hidden = true;
}
function renderActivity(ev) {
  $('#activity').innerHTML = '<ul>' + (ev || []).slice(-25).reverse().map(e => `<li><b>${esc(e.agent)}</b> · ${esc(e.kind)} · <span class="meta">${esc(e.at)}</span><br>${esc(e.text)}</li>`).join('') + '</ul>';
}
const planStatus = {};
async function planAct(id, act){ const r = await api(`/api/plan/${id}/${act}`, {}); if (r.plan) planStatus[id] = r.plan.status; refresh(); }
async function propAct(id, act){ const r = await api(`/api/proposals/${id}/${act}`, {}); lastAccepted = r.proposal && r.proposal.status === 'accepted' ? r.proposal : null; refresh(); }
async function switchView(t){ await api('/api/view', {type: t}); refresh(); }
async function forget(key){ await fetch('/api/beliefs/' + encodeURIComponent(key), {method: 'DELETE'}); refresh(); }
async function doImport(){
  const f = $('#import-file').files[0]; let filename = 'note.txt', content = $('#import-text').value;
  if (f) { filename = f.name; content = await f.text(); }
  if (!content.trim()) return;
  await busy(api('/api/import', {filename, content})); $('#import-text').value = ''; $('#import-file').value = ''; refresh();
}
async function busy(p){ document.body.classList.add('busy'); try { return await p; } finally { document.body.classList.remove('busy'); } }
async function send() {
  const inp = $('#chat-input'), text = inp.value.trim(); if (!text) return;
  inp.value = '';
  if (active) await busy(api('/api/chat', {item_id: active, text}));
  else await busy(api('/api/command', {text, mode: document.querySelector('input[name=mode]:checked').value}));
  refresh();
}
async function reply(id, text){ await busy(api('/api/chat', {item_id: id, text})); refresh(); }
function hint(id, text){ active = id; const i = $('#chat-input'); i.value = text; i.focus(); i.select(); }
async function undo(id){ await api('/api/undo', {undo_id: id}); refresh(); }
async function markDone(id){ await api(`/api/items/${id}/done`, {}); timerEnd = null; refresh(); }
async function scrub(min){ const d = parse(S.now); d.setMinutes(d.getMinutes() + min); await busy(api('/api/clock', {now: isoOf(d)})); refresh(); }
async function nextMorning(){ const d = parse(S.now); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); await busy(api('/api/clock', {now: isoOf(d)})); refresh(); }
